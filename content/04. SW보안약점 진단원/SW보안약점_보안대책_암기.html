<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW보안약점 진단원 · 보안대책 암기</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--bd:#e3e6ea;--tx:#1a1d21;--mut:#6b7280;--ac:#1f6feb;--ok:#137a3f;--no:#c0392b;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.7}
header{position:sticky;top:0;z-index:9;background:rgba(246,247,249,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--bd)}
.hin{max-width:940px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:700}
.sc{margin-left:auto;font-size:13px;color:var(--mut);display:flex;gap:12px}
.sc b{font-weight:700}
main{max-width:940px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,button,input,textarea{font-family:inherit}
select{font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 10px}
button{font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer}
button:hover{background:#f0f2f5}
.jump{display:inline-flex;gap:6px;align-items:center}
.jump input{font-size:13px;border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 8px;width:70px}
.pill{display:inline-block;font-size:12px;background:#eef2f7;color:#334155;border-radius:999px;padding:3px 10px;margin-right:6px}
.pill.g{background:#e8f0fe;color:#1f4d8f}
.qhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qname{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:6px 0 2px}
.pg{font-size:12px;color:var(--mut)}
.cnt{margin-left:auto;font-size:12px;color:var(--mut)}
textarea{width:100%;min-height:96px;border:1px solid var(--bd);border-radius:10px;padding:11px 13px;font-size:14.5px;line-height:1.65;resize:vertical;background:#fcfdff}
textarea:focus{outline:2px solid #cfe0ff;border-color:#9dbdf5}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.big{flex:1;min-width:150px;padding:13px;font-size:15px;font-weight:700;border-radius:10px;border:1.5px solid var(--ac);color:var(--ac);background:#fff}
.big:hover{background:#eef4ff}
.big.sub{border-color:var(--bd);color:var(--mut);font-weight:600;flex:0 0 auto;min-width:0}
.sect{margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd)}
.lab{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.4px;margin-bottom:6px}
.lab .tagx{font-weight:500;letter-spacing:0;color:#9aa3af}
.ansbox{background:#f0f7ff;border:1px solid #cfe0ff;border-radius:10px;padding:13px 15px;font-size:15.5px;line-height:1.75}
.kw{display:flex;flex-wrap:wrap;gap:8px}
.kwi{font-size:13.5px;border-radius:8px;padding:6px 11px;border:1px solid var(--bd);background:#fafbfc}
.kwi.hit{border-color:#a7d9bb;background:#eefaf2;color:var(--ok)}
.kwi.hit::before{content:"○ ";font-weight:700}
.kwi.miss::before{content:"× ";color:var(--no);font-weight:700}
.raw{background:#fbfbfc;border:1px solid var(--bd);border-left:3px solid #cbd2da;border-radius:0 10px 10px 0;padding:12px 15px;font-size:14.5px;color:#2b3138;white-space:pre-wrap}
details{margin-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--mut);user-select:none}
summary:hover{color:var(--tx)}
.grade{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.grade button{flex:1;min-width:110px;padding:12px;font-weight:700;font-size:14px;border-radius:10px}
.g1{border-color:#a7d9bb;color:var(--ok)}.g1:hover{background:#eefaf2}
.g2{border-color:#e7c98a;color:var(--warn)}.g2:hover{background:#fdf6e8}
.g3{border-color:#e9b4ad;color:var(--no)}.g3:hover{background:#fdefed}
.mark{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:700}
.m1{background:#eefaf2;color:var(--ok)}.m2{background:#fdf6e8;color:var(--warn)}.m3{background:#fdefed;color:var(--no)}
.nav{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:#9aa3af;text-align:center;margin:14px 0 30px}
.hint kbd{background:#fff;border:1px solid var(--bd);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit}
.note{font-size:12px;color:var(--mut);margin-top:6px}
.empty{color:var(--mut);text-align:center;padding:30px}
.stg{display:inline-flex;gap:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.stg button{border:none;border-radius:0;padding:7px 13px;font-weight:700;font-size:13px;background:#fff;color:var(--mut)}
.stg button.on{background:#eef4ff;color:#2456c8}
.stg button+button{border-left:1px solid var(--bd)}
#q{min-width:190px;flex:1 1 190px}
.sr{border:1px solid var(--bd);border-radius:10px;margin-top:8px;overflow:hidden}
.sr button{display:block;width:100%;text-align:left;border:none;border-radius:0;padding:9px 13px;background:#fff;font-size:13.5px}
.sr button+button{border-top:1px solid var(--bd)}
.sr button:hover{background:#eef4ff}
.sr .sk{font-weight:700;color:#2456c8;margin-right:8px}
.sr .ss{color:var(--mut);font-size:12px;margin-left:8px}
.impl{display:flex;flex-wrap:wrap;gap:8px}
.impl span{font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;background:#fafbfc}
@media print{header,.bar,.acts,.grade,.nav,.hint,textarea{display:none!important}
 .card{break-inside:avoid;border:none;border-bottom:1px solid #ccc;border-radius:0;padding:10px 0}
 body{background:#fff;font-size:11.5pt}}
</style></head>
<body>
<header><div class="hin">
  <h1>보안대책 암기 · 구현단계 49항목</h1>
  <div class="sc"><span>진행 <b id="sPos">-</b></span><span style="color:var(--ok)">암기 <b id="sOk">0</b></span><span style="color:var(--warn)">애매 <b id="sMid">0</b></span><span style="color:var(--no)">모름 <b id="sNo">0</b></span></div>
</div></header>
<main>
<div class="card"><div class="bar">
  <span class="stg"><button id="bImpl" class="on">구현단계 49</button><button id="bDsgn">설계단계 20</button></span>
  <input id="q" type="search" placeholder="검색 — 구현+설계 전체" autocomplete="off">
  <select id="fSec"></select>
  <select id="fLen"><option value="">길이 전체</option><option value="s">짧은 것(100자 이하)</option><option value="l">긴 것(100자 초과)</option></select>
  <button id="bShuf">순서 섞기</button>
  <button id="bWeak">애매+모름만 다시</button>
  <button id="bReset">기록 초기화</button>
  <span class="jump"><input id="jN" type="number" min="1" placeholder="번호"><button id="bGo">이동</button></span>
  <span class="cnt" id="sFilter"></span>
</div></div>
<div id="srch"></div>
<div id="host"></div>
<div class="hint"><kbd>Space</kbd> 답 보기 / 다음 · <kbd>1</kbd> 암기 · <kbd>2</kbd> 애매 · <kbd>3</kbd> 모름 · <kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>Ctrl</kbd>+<kbd>P</kbd> 인쇄</div>
</main>
<script>
const DB = {"m": [{"k": "1-1", "sec": 1, "name": "SQL 삽입", "pg": "p.181~192", "ans": "정적 쿼리를 사용하는 PreparedStatement 객체로 컴파일된 쿼리문을 DB에 전달하고, 외부 입력값은 setString 등으로 파라미터 바인딩한다. 쿼리에 사용되는 외부 입력값에 대해 특수문자와 쿼리 예약어를 필터링한다.", "kw": ["PreparedStatement", "파라미터 바인딩", "특수문자·쿼리 예약어 필터링", "프레임워크 검증모듈"], "guard": "PreparedStatement객체 등을 이용하여 DB에 컴파일 된 쿼리문(상수)을 전달하는 방법을 사용 한다. PreparedStatement를 사용하는 경우에는 DB 쿼리에 사용되는 외부입력값에 대하여 특수문자 및 쿼리 예약어를 필터링하고, 스트러츠(Struts), 스프링(Spring) 등과 같은 프레임워크를 사용하는 경우에는 외부입력값 검증모듈 및 보안모듈을 상황에 맞추어 적절하게 사용한다. Perl의 DBI, PHP의 PDO, ASP의 ADO를 이용하여 사용가능", "diag": "Statement statement 객체로 쿼리가 실행되는 부분을 확인하고(①), Statement 객체가 Pre-paredStatement 객체인지 확인한다(②). PreparedStatement 객체를 사용하고 setString 등의 메소 드로 외부 입력값을 설정하는 경우에는 기본적으로 안전하다고 판정하지만, 쿼리에 사용되는 변수가 외부 입력값인 경우엔 적절한 필터링 모듈이 존재하는지 추가로 확인해야 한다(③). 즉, 쿼리 생성과 관련된 외부 입력값에 대한 필터링 모듈이 반드시 존재해야 하며, 그 외에도 관련 프레임워크 에서 적절한 조치가 이루어질 경우에 안전하다고 판정한다."}, {"k": "1-2", "sec": 1, "name": "코드삽입", "pg": "p.194~200", "ans": "동적코드를 실행할 수 있는 함수를 사용하지 않는다. 필요한 경우 동적코드에 사용되는 외부 입력값을 화이트리스트 방식으로 구현하거나 유효한 문자만 포함하도록 필터링한다.", "kw": ["동적코드 실행 함수 미사용", "화이트리스트", "유효 문자만 필터링"], "guard": "동적코드를 실행할 수 있는 함수를 사용하지 않는다. 필요 시, 실행 가능한 동적코드를 입력 값으로 받지 않도록, 외부 입력 값에 대하여 화이트리스트 방식으로 구현한다. 또는 유효한 문자만 포함하도록 동적 코드에 사용되는 사용자 입력 값을 필터링 한다.", "diag": "각 언어에서 제공하고 있는 동적실행 함수를 확인한다(①). 아래 예제에서는 자바 코드에서 자바 스크립트를 사용하고 있다. 동적코드 실행에 사용되는 데이터가 신뢰할 수 있는 값인지 확인한다.(②) 이 때, 데이터가 신뢰할 수 없는 값이나 별도의 검증절차가 없으면 취약하다고 판단한다."}, {"k": "1-3", "sec": 1, "name": "경로 조작 및 자원 삽입", "pg": "p.202~209", "ans": "외부 입력을 파일·소켓 포트 등 자원의 식별자로 사용하는 경우 적절한 검증을 거치게 하거나 사전에 정의된 적합한 리스트에서 선택되도록 한다. 파일명인 경우 경로 순회 공격 위험 문자( / \\ .. 등)를 제거하는 필터를 사용한다.", "kw": ["사전 정의된 리스트에서 선택", "경로 순회(directory traversal)", "/ \\ .. 제거 필터"], "guard": "외부의 입력을 자원(파일, 소켓의 포트 등)의 식별자로 사용하는 경우, 적절한 검증을 거치도록 하거나, 사전에 정의된 적합한 리스트에서 선택되도록 한다. 특히, 외부의 입력이 파일명인 경우에는 경로 순회(directory traversal) 공격의 위험이 있는 문자( “ / \\ .. 등 )를 제거할 수 있는 필터를 이용 한다.", "diag": "디렉토리 경로나 자원에 대한 접근 경로 생성, 자원을 제어하기 위한 코드는 외부의 입력값이 경로 생성과 자원제어에 직접적으로 영향을 주어서는 안된다. 따라서, 외부 입력값이 해당 작업에 직접적인 영향을 미치는지 확인한다. 이를 효과적으로 판단하기 위한 방법은 다음과 같다. 먼저 경로 생성과 자원제어를 위한 코드에 외부 입력값을 사용하지지 여부를 확인한 후, 외부 입력값을 사용하는 경우 적절한 필터링이 이루어지거나 리스트의 값이 선택되는 지 확인한다. 또한, 시스템 경로를 얻기 위해 경로를 직접 입력하는 대신 시스템 함수를 호출하여 경로를 생성하는 것이 바람직하므로, 이러한 함수가 사용되는지 확인한다. [ 경로 조작 ] 파일객체를 사용하는지 확인하고(①), 해당 파일에 대한 접근이 외부에서 직접 접근하는지 확인한다(②). 파일객체가 가리키는 경로에 외부 입력 값이 경로 순회 문자열에 대한 제거없이 사용되면 경로의 변경이 가능하게 되어 취약하다고 판정한다."}, {"k": "1-4", "sec": 1, "name": "크로스사이트 스크립트", "pg": "p.212~221", "ans": "외부 입력값에 스크립트가 삽입되지 못하도록 문자변환 함수를 사용하여 < > & \" 등을 &lt; &gt; &amp; &quot; 로 치환한다. HTML 태그를 허용하는 게시판에서는 허용 태그를 화이트리스트로 만들어 해당 태그만 지원한다.", "kw": ["문자변환 함수·치환", "&lt; &gt; &amp; &quot;", "허용 태그 화이트리스트"], "guard": "외부입력값에 스크립트가 삽입되지 못하도록 문자변환 함수 또는 메서드를 사용하여 < > & “ 등을 &lt; &gt; &amp; &quot;로 치환한다. HTML태그를 허용하는 게시판에서는 허용되는 HTML 태그들을 화이트리스트로 만들어 해당 태그만 지원하도록 한다.", "diag": "웹 페이지로 출력하는 변수값이 존재하는지 확인하고(①), 해당 변수값이 외부 입력값 또는 사용자 입력 데이터 폼에 의해 저장된 데이터 베이스 값인지 확인한(②) 후 변수값이 적절하게 필터를 거치는지 확인한다. 적절한 필터를 거친 후 출력되는 경우나 프레임워크 등을 사용하여 자체적인 검증 기능이 존재하면 안전하지만 그 외에는 취약하다."}, {"k": "1-5", "sec": 1, "name": "운영체제 명령어 삽입", "pg": "p.223~230", "ans": "웹 인터페이스로 시스템 명령어가 전달되지 않도록 구성하고, 외부에서 전달되는 값을 검증 없이 시스템 내부 명령어로 사용하지 않는다. 명령어 생성·선택이 필요하면 필요한 값들을 미리 지정해 놓고 외부 입력에 따라 선택하여 사용한다.", "kw": ["검증 없는 명령어 사용 금지", "미리 지정된 값 중 선택", "웹 인터페이스 명령어 전달 차단"], "guard": "웹 인터페이스로 서버 내부로 시스템 명령어를 전달시키지 않도록 응용프로그램을 구성하고, 외부 에서 전달되는 값을 검증 없이 시스템 내부 명령어로 사용하지 않는다. 외부 입력에 따라 명령어를 생성 하거나 선택이 필요한 경우에는 명령어 생성에 필요한 값들을 미리 지정해 놓고 외부 입력에 따라 선택하여 사용한다.", "diag": "운영체제 명령어(exec(), system(), Runtime.getRuntime().exec 등)를 실행할 수 있는 함수가 호출되는지 확인하고(①) 외부에서 전달되는 값이 시스템 내부명령어의 일부 또는 전부로 사용되는지 확인한다(②). 정해진 후보군에서 선택된 값(White List)이거나 적절하게 검증하면 안전하고 그 외에는 취약하다."}, {"k": "1-6", "sec": 1, "name": "위험한 형식 파일 업로드", "pg": "p.232~238", "ans": "화이트리스트 방식으로 허용된 확장자만 업로드를 허용한다. 저장 시 파일명과 확장자를 외부 사용자가 추측할 수 없는 문자열로 변경하고, 저장 경로를 web document root 밖에 두며, 실행 속성을 제거한다.", "kw": ["확장자 화이트리스트", "파일명·확장자 변경", "web document root 밖 저장", "실행 속성 제거"], "guard": "화이트 리스트 방식으로 허용된 확장자만 업로드를 허용한다. 업로드 되는 파일을 저장할 때에는 파일명과 확장자를 외부사용자가 추측할 수 없는 문자열로 변경하여 저장하며, 저장 경로는 ‘web document root’ 밖에 위치시켜서 공격자의 웹으로 직접 접근을 차단한다. 또한 파일 실행여부를 설 정할 수 있는 경우, 실행 속성을 제거한다.", "diag": "외부 입력값에서 파일명을 얻어오는 부분이 존재하는지 확인하고(①), 허용된 확장자에 대해서만 파일 업로드를 허용하는지 확인한다(②). 제어문 등을 사용하여 허용된 파일만 업로드 될 경우와 업로드된 파일명을 외부에서 알 수 없는 형태로 변경할 경우엔 안전하지만 그 외에는 취약하다."}, {"k": "1-7", "sec": 1, "name": "신뢰되지 않는 URL 주소로 자동접속 연결", "pg": "p.239~243", "ans": "자동 연결할 외부 사이트의 URL과 도메인은 화이트리스트로 관리하고, 사용자 입력값을 자동 연결 주소로 사용하는 경우 입력값이 화이트리스트에 존재하는지 확인한다.", "kw": ["URL·도메인 화이트리스트", "존재 여부 확인"], "guard": "자동 연결할 외부 사이트의 URL과 도메인은 화이트 리스트로 관리하고, 사용자 입력값을 자동 연결 할 사이트 주소로 사용하는 경우에는 입력된 값이 화이트 리스트에 존재하는지 확인해야 한다.", "diag": "외부 사이트로 리다이렉션하는 함수나 메소드(java의 경우 response.sendRedirect 메소드)가 존재 하는지 확인하고(①), 리다이렉션 하는 함수나 메소드의 인자값(url)이 외부 입력값인지 확인한다(②). 일반적으로 외부에서 입력받는 변수가 아닌 경우 안전하다고 판정한다. 외부에서 입력받는 변수인 경우, 리다이렉션 하는 함수나 메소드의 인자값(url)을 관리하는지 확인해서 유효값 검사 및 화이트 리스트로 관리하는 경우 안전한 것으로 판정한다."}, {"k": "1-8", "sec": 1, "name": "부적절한 XML 외부개체 참조", "pg": "p.245~250", "ans": "로컬 정적 DTD를 사용하도록 설정하고 외부에서 전송된 XML 문서에 포함된 DTD를 완전히 비활성화한다. 비활성화할 수 없는 경우 외부 엔티티 및 외부 문서 유형 선언을 각 파서에 맞는 고유한 방식으로 비활성화한다.", "kw": ["로컬 정적 DTD", "DTD 비활성화", "외부 엔티티·외부 문서 유형 선언 비활성화"], "guard": "로컬 정적 DTD를 사용하도록 설정하고, 외부에서 전송된 XML문서에 포함된 DTD를 완전하게 비활 성화해야 한다. 비활성화를 할 수 없는 경우에는 외부 엔티티 및 외부 문서 유형 선언을 각 파서에 맞는 고유한 방식으로 비활성화 한다.", "diag": "XML 파일을 파싱하고 있는지 확인한 후(①) 신뢰할 수 없는 외부 입력 값의 파일에 대한 외부 엔티티를 비활성화하는 코드가 없을 경우 취약하다고 판정한다."}, {"k": "1-9", "sec": 1, "name": "XML 삽입", "pg": "p.251~262", "ans": "XQuery 또는 XPath 쿼리에 사용되는 외부 입력데이터에 대하여 특수문자 및 쿼리 예약어를 필터링하고, 파라미터화된 쿼리문을 지원하는 XQuery를 사용한다.", "kw": ["특수문자·쿼리 예약어 필터링", "파라미터화된 쿼리문", "XQuery"], "guard": "XQuery 또는 Xpath 쿼리에 사용되는 외부 입력데이터에 대하여 특수문자 및 쿼리 예약어를 필터링 하고 파라미터화된 쿼리문을 지원하는 XQuery를 사용한다.", "diag": "ㆍ XQuery 삽입 XQuery가 실행되는 부분을 확인하고(①), XQuery 쿼리스트링에 사용되는 변수가 외부 입력값 여부를 확인한 후(②), 변수에 대한 필터링 모듈이 존재하는지 확인한다. 필터링 모듈이 존재하거나 관련 프레임워크에서 적절히 조치할 경우 안전한 것으로 판정한다."}, {"k": "1-10", "sec": 1, "name": "LDAP 삽입", "pg": "p.264~270", "ans": "DN(Distinguished Name)과 필터에 사용되는 사용자 입력값에 특수문자가 포함되지 않도록 특수문자를 제거한다. 특수문자를 사용해야 하는 경우에는 = + < > # ; \\ 등이 실행 명령이 아닌 일반문자로 인식되도록 처리한다.", "kw": ["DN·필터", "특수문자 제거", "일반문자로 인식되도록 처리"], "guard": "DN(Distinguished Name)과 필터에 사용되는 사용자 입력값에는 특수문자가 포함되지 않도록 특수 문자를 제거한다. 만약 특수문자를 사용해야 하는 경우에는 특수문자( = + < > # ; \\ 등)가 실행 명령이 아닌 일반문자로 인식되도록 처리한다.", "diag": "LDAP 조회 쿼리가 실행됨을 확인하고(①), LDAP 조회문의 필터에 사용되는 변수가 외부 입력값 인지 확인한 후(②), 해당 변수에 대한 필터링 모듈이 존재하는지 확인한다(③). 필터링 모듈이 존재 하거나 관련 프레임워크에서 적절히 조치할 경우엔 안전한 것으로 판정한다."}, {"k": "1-11", "sec": 1, "name": "크로스사이트 요청 위조", "pg": "p.272~274", "ans": "입력화면 폼 작성 시 GET보다 POST 방식을 사용하고, 입력화면 폼과 처리 프로그램 사이에 토큰을 사용하여 공격자의 직접적인 URL 사용이 동작하지 않도록 한다. 중요한 기능은 사용자 세션검증과 더불어 재인증을 유도한다.", "kw": ["POST 방식", "토큰", "세션검증·재인증"], "guard": "입력화면 폼 작성시 GET 방식보다는 POST 방식을 사용하고 입력화면 폼과 해당 입력을 처리하는 프로그램 사이에 토큰을 사용하여, 공격자의 직접적인 URL 사용이 동작하지 않도록 처리한다. 특히 중요한 기능에 대해서는 사용자 세션검증과 더불어 재인증을 유도한다.", "diag": "사용자 권한변경, 신규정보 등록 등 주요 기능을 확인하고(①), 해당 기능 수행시 권한확인 절차 존재 여부 확인한다(②). 권한확인 절차가 없거나 권한 확인 방법이 세션쿠키, 사용자 IP, SSL 인증과 같이 자동 제출되는 자격증명에 의존하는 경우 취약하다."}, {"k": "1-12", "sec": 1, "name": "서버사이드 요청 위조", "pg": "p.277~281", "ans": "사용자 입력값을 다른 시스템의 서비스 호출에 사용하는 경우 화이트리스트 방식으로 필터링한다. 무작위 URL을 받아들여야 한다면 내부 URL을 블랙리스트로 지정해 필터링하고, 동일한 내부 네트워크라도 기기 인증과 접근권한을 확인한다.", "kw": ["화이트리스트 필터링", "내부 URL 블랙리스트", "기기 인증·접근권한 확인"], "guard": "식별할 수 있는 범위 내에서 사용자의 입력 값을 다른 시스템의 서비스 호출에 사용하는 경우, 사용자의 입력 값을 화이트리스트 방식으로 필터링한다. 사용자가 지정하는 무작위의 URL을 받아들여야 한다면 내부의 URL을 블랙리스트로 지정하여 필터링 한다. 또한 동일한 내부 네트워크에 있더라도 기기 인증, 접근권한을 확인하여 요청이 이루어질 수 있도록 한다.", "diag": "다른 시스템의 서비스를 호출하는 함수가 존재하는지 확인하고(①) 다른 시스템을 호출할 때 사용되는 입력 값이(②) 신뢰할 수 있는 값인지 확인한다. 만약 입력 값이 신뢰할 수 없고 별도의 검증절차가 없으면 안전하지 않다고 판정한다."}, {"k": "1-13", "sec": 1, "name": "HTTP 응답분할", "pg": "p.284~288", "ans": "요청 파라미터의 값을 Set-Cookie 등 HTTP 응답헤더에 포함시킬 경우 CR, LF와 같은 개행문자를 제거한다.", "kw": ["HTTP 응답헤더", "CR·LF 개행문자 제거"], "guard": "요청 파라미터의 값을 HTTP응답헤더(예를 들어, Set-Cookie 등)에 포함시킬 경우 CR, LF와 같은 개행문자를 제거한다.", "diag": "Response 헤더에 변수가 사용되는 것을 확인하고(①), 변수가 외부 입력값인지 확인한 후(②), 개행 문자(\\r, \\n) 제거를 위한 필터링 또는 검증절차가 있는지 확인한다. 외부 입력값에 대한 필터링 절차가 없다면 취약하다."}, {"k": "1-14", "sec": 1, "name": "정수형 오버플로우", "pg": "p.290~295", "ans": "언어·플랫폼별 정수타입의 범위를 확인하여 사용하고, 정수형 변수를 연산에 사용하는 경우 결과값의 범위를 체크하는 모듈을 사용한다. 외부 입력값을 동적 메모리 할당에 사용하는 경우 값이 적절한 범위 내인지 확인한다.", "kw": ["정수타입 범위 확인", "연산 결과값 범위 체크", "동적 메모리 할당 전 범위 확인"], "guard": "언어·플랫폼별 정수타입의 범위를 확인하여 사용한다. 정수형 변수를 연산에 사용하는 경우, 결과값의 범위를 체크하는 모듈을 사용한다. 외부입력 값을 동적 메모리 할당에 사용하는 경우, 변수값이 적절한 범위 내에 존재하는 값인지 확인한다.", "diag": "변수를 사용하여 배열의 크기를 동적으로 결정하고 있는 경우(①), 변수가 외부 입력값인지 확인하고 (②), 해당 변수가 의도한 범위내에 존재하는지 확인하는 절차가 있는지 확인한다. 외부 입력값에 대한 검증 절차가 없다면 취약하다."}, {"k": "1-15", "sec": 1, "name": "보안기능 결정에 사용되는 부적절한 입력값", "pg": "p.297~301", "ans": "상태정보나 세션정보와 같은 중요한 정보는 서버에 저장하고 보안확인 절차도 서버에서 실행한다. 신뢰할 수 없는 입력값이 들어오는 지점과 보안결정에 사용되는 입력값을 식별하고, 제공되는 입력값에 의존할 필요가 없는 구조로 변경할 수 있는지 검토한다.", "kw": ["서버에 저장·서버에서 검증", "입력 지점 식별", "입력값에 의존하지 않는 구조"], "guard": "상태정보나 민감한 데이터 특히 사용자 세션정보와 같은 중요한 정보는 서버에 저장하고 보안확인 절차도 서버에서 실행한다. 보안설계관점에서 신뢰할 수 없는 입력값이 응용프로그램 내부로 들어올 수 있는 지점과 보안결정에 사용되는 입력값을 식별하고 제공되는 입력값에 의존할 필요가 없는 구조로 변경할 수 있는지 검토한다.", "diag": "인증여부를 확인하기 위해 사용하는 변수를 확인하고(①), 변수가 세션정보 등 서버내부에서 검증된 값인지 확인한다(②). 인증결정의 기준으로 외부 입력값을 그대로 사용하는 경우 취약하다."}, {"k": "1-16", "sec": 1, "name": "메모리 버퍼 오버플로우", "pg": "p.304~307", "ans": "메모리 버퍼 사용 시 적절한 버퍼 크기를 설정하고 설정된 범위의 메모리 내에서 올바르게 읽고 쓸 수 있게 통제한다. 문자열 저장 시 널(Null) 문자를 버퍼 범위 내에 삽입하여 널 문자로 종료되도록 한다.", "kw": ["적절한 버퍼 크기 설정", "범위 내 읽기·쓰기 통제", "널(Null) 문자로 종료"], "guard": "프로그램 상에서 메모리 버퍼를 사용할 경우 적절한 버퍼의 크기를 설정하고, 설정된 범위의 메모리 내에서 올바르게 읽거나 쓸 수 있게 통제하여야 한다. 특히, 문자열 저장시 널(Null) 문자로 종료하지 않으면 의도하지 않은 결과를 가져오게 되므로 널(Null) 문자를 버퍼 범위내에 삽입하여 널(Null) 문자로 종료되도록 해야 한다.", "diag": "버퍼에 값을 기록하는 경우, 값의 크기가 대상 버퍼보다 작은지 확인한다. 버퍼의 크기나 데이터의 크기가 외부 입력 값에 의해 결정되는 경우 입력 값의 크기가 대상 데이터를 충분히 포함할 수 있는지 확인한다. 버퍼의 크기를 비교하거나 인덱싱으로 접근할 경우에는 데이터의 크기 비교 외에도 음수값이 포함 되 지 않도록 0보다 큰지 반드시 확인한다. 메모리 버퍼에 접근할 때 상수로 바로 접근하는 경우 해당 상수값을 확인해야하며, 상수를 이용하는 것보다 버퍼의 범위를 고려하여 접근을 하도록 코드의 수정 이 이루어져야한다. 특히, 반복문으로 버퍼에 접근 할 때 반드시 경계값에 대한 확인이 필요하다. 또한 문자열을 처리하기 위해 버퍼를 사용할 경우 문자열의 마지막에 널(Null) 문자가 포함되는지 반드시 확인한다. 다음 예제는 매개변수로 입력받은 값을 버퍼에 복사하는 코드이다. 버퍼의 크기는 16 byte로 한정되어 있기 때문에 매개변수의 크기가 이보다 클 경우 버퍼의 영역을 벗어나 데이터가 기록되지만, 입력 값의 크기에 대한 어떠한 검사도 이루어 지지 않기 때문에 아래와 같은 코드는 보안약점이 존재하는 코드로 진단할 수 있다."}, {"k": "1-17", "sec": 1, "name": "포맷 스트링 삽입", "pg": "p.309~312", "ans": "포맷 문자열을 사용하는 함수에 사용자 입력값을 직접 포맷 문자열로 사용하거나 포맷 문자열 생성에 포함시키지 않는다. %n, %hn은 포맷 스트링 매개변수로 사용하지 않으며, 가능하면 %s 포맷 문자열을 지정하고 사용자 입력값은 두 번째 이후의 파라미터로 사용한다.", "kw": ["입력값을 포맷 문자열로 사용 금지", "%n·%hn 사용 금지", "%s 지정 후 2번째 이후 파라미터"], "guard": "printf(), snprintf() 등 포맷 문자열을 사용하는 함수를 사용할 때는 사용자 입력값을 직접적으로 포맷 문자열로 사용하거나 포맷 문자열 생성에 포함시키지 않는다. 포맷 문자열을 사용하는 함수에 사용자 입력값을 사용할 때는 사용자가 포맷 스트링을 변경할 수 있는 구조로 쓰지 않는다. 특히, %n, %hn은 공격자가 이를 이용해 특정 메모리 위치에 특정값을 변경할 수 있으므로 포맷 스트링 매개변수로 사용하지 않는다. 사용자 입력값을 포맷 문자열을 사용하는 함수에 사용할 때는 가능하면 %s 포맷 문자열을 지정하고, 사용자 입력값은 2번째 이후의 파라미터로 사용한다.", "diag": "포맷 스트링을 이용하는 함수를 사용하는 경우 인자로 포맷 스트링이 포함되어 있는지 반드시 확인하고, 외부 입력 값이 포맷 스트링에 생성에 사용되는지 확인한다. 포맷 스트링이 함수의 인자로 포함 되어 있고, 외부 입력 값이 포맷 스트링 생성에 사용되지 않으며, 포맷 스트링에서 사용하는 인자의 개수와 매개변수로 포함된 인자의 개수가 일치하는 경우 안전하다고 판단한다. 또한 포맷에 출력할 데이터의 길이를 반드시 한정하도록 한다. 그 외에는 모두 취약하다고 판단한다. 다음 예제는 포맷 스트링이 인자로 존재하지만, 사용자 입력값을 포맷 스트링 생성에 사용하기 때문에 보안약점이 존재하는 코드로 진단할 수 있다. 공격자가 “%1$tm, %1$te, %1$tY”와 같은 입력을 하게 된다면, 예제코드는 문제를 일으키게 된다."}, {"k": "2-1", "sec": 2, "name": "적절한 인증 없는 중요기능 허용", "pg": "p.314~318", "ans": "클라이언트의 보안검사를 우회하여 서버에 접근하지 못하도록 설계하고, 중요한 정보가 있는 페이지에는 재인증을 적용한다. 안전하다고 검증된 라이브러리나 프레임워크(OpenSSL, ESAPI 등)의 보안기능을 사용한다.", "kw": ["클라이언트 검사 우회 차단", "재인증 적용", "검증된 라이브러리·프레임워크"], "guard": "클라이언트의 보안검사를 우회하여 서버에 접근하지 못하도록 설계하고 중요한 정보가 있는 페이지는 재인증을 적용(은행 계좌이체 등)한다. 또한 안전하다고 검증된 라이브러리나 프레임워크(OpenSSL 이나 ESAPI의 보안기능 등)를 사용하는 것이 중요하다.", "diag": "해당 취약점은 보안특성 중 개인정보와 관련된 취약점으로 정적도구를 사용하여 이를 판단하는 것은 쉽지 않다. 이에 따라 진단원이 직접 코드를 보며 해당 정보가 중요정보인지 파악해야한다. 비밀번호, 개인정보(주민등록번호, 여권번호, 외국인 식별번호 등), 금융정보(카드번호, 계좌정보 등) 게시글 수정, 삭제 등을 포함하여 접근 및 사용이 제한되어야 하는 중요정보 및 기능을 정의하였는지 확인 하고 사용여부를 확인한다(①). 중요정보를 사용하는 경우 접근 변경 시 적절한 인증 여부를 확인하여 허용 하는 기능이 구현되었는지 확인(②)한다. 만약 적절한 인증여부를 확인하는 경우 안전 하다고 판단하고, 인증여부를 확인하지 않는 경우 취약하다고 판단한다."}, {"k": "2-2", "sec": 2, "name": "부적절한 인가", "pg": "p.319~323", "ans": "응용프로그램이 제공하는 정보와 기능을 역할에 따라 배분하여 공격자에게 노출되는 공격노출면(Attack Surface)을 최소화하고, 사용자 권한에 따른 ACL을 관리한다. JAAS Authorization Framework나 OWASP ESAPI Access Control 등을 사용할 수 있다.", "kw": ["역할에 따른 기능 배분", "공격노출면(Attack Surface) 최소화", "ACL 관리"], "guard": "응용프로그램이 제공하는 정보와 기능을 역할에 따라 배분함으로써 공격자에게 노출되는 공격노 출면(Attack Surface)을 최소화하고 사용자의 권한에 따른 ACL(Access Control List)을 관리한다. JAAS Authorization Framework나 OWASP ESAPI Access Control 등의 프레임워크를 사용해서 취약점을 제거할 수도 있다.", "diag": "해당 취약점은 보안특성 중 외부 시스템(웹서버, DB서버, LADP 등)의 권한 설정과 관련된 취약점으로 정적도구를 사용하여 이를 판단하는 것은 쉽지 않다. 먼저 중요정보를 저장할 수 있는 외부시스템이 존재하는지 식별하고 해당시스템에 접근(열람) 및 변경(생성 ․ 삭제 ․ 수정 등)에 대한 권한을 사전에 적절하게 정의하였는지 확인한다. 해당 정보 또는 기능(접근 ․ 변경)을 호출하는 함수에서, 사전에 정의한 권한 소유여부를 검사하는지 확인(①)한다. 또한 접근제어를 서버측이 아닌 JavaScript 등과 같이 클라이언트측에서 제어 하여 우회가 가능한지 확인한다."}, {"k": "2-3", "sec": 2, "name": "중요한 자원에 대한 잘못된 권한 설정", "pg": "p.325~329", "ans": "설정파일·실행파일·라이브러리 등은 SW 관리자에 의해서만 읽고 쓰기가 가능하도록 설정하고, 중요한 자원을 사용하는 경우 허가받지 않은 사용자가 접근 가능한지 검사한다.", "kw": ["관리자만 읽기·쓰기 가능", "중요 자원 접근 가능 여부 검사"], "guard": "설정파일, 실행파일, 라이브러리 등은 SW 관리자에 의해서만 읽고 쓰기가 가능하도록 설정하고 설정 파일과 같이 중요한 자원을 사용하는 경우, 허가받지 않은 사용자가 중요한 자원에 접근 가능한지 검사한다.", "diag": "해당 취약점은 보안특성 중 중요자원에 대한 접근 권한 설정과 관련된 취약점으로 정적도구를 사용 하여 중요자원이 무엇인지 판단하는 것은 어려운 작업이다. 이에 따라 진단원이 직접 중요자원을 식별하고 이에 대한 취약성을 판단하는 것이 필요하다. SW에서 생성하는 중요자원(파일 등)이 존재하는지 식별한다. 사용자 업로드 파일, 프로그램이 사용 하는 설정파일 등 중요자원에 대해 읽기, 쓰기, 실행 등의 권한을 사전에 정의하였는지 확인하고 사전에 정의한 권한대로 중요자원에 접근권한을 허용하는지 확인한다. 설정파일, 문서파일의 경우 실행 권한이 설정되지 않았는지 확인하여야 한다. SW가 중요한 보안관련 자원에 대하여 읽기 또는 수정하기 권한을 의도하지 않게 허가할 경우, 권한을 갖지 않은 사용자가 해당자원을 사용하게 된다."}, {"k": "2-4", "sec": 2, "name": "취약한 암호화 알고리즘 사용", "pg": "p.331~335", "ans": "자신만의 암호화 알고리즘을 개발하지 않고 학계·업계에서 검증된 표준화된 알고리즘을 사용한다. DES, RC5 등 취약하다고 알려진 알고리즘 대신 3DES, AES, SEED 등 안전한 알고리즘으로 대체하고, 개인정보 등에는 검증필 암호모듈을 사용한다.", "kw": ["자체 개발 알고리즘 금지", "DES·RC5 → 3DES·AES·SEED", "검증필 암호모듈"], "guard": "자신만의 암호화 알고리즘을 개발하는 것은 위험하며, 학계 및 업계에서 이미 검증된 표준화된 알고 리즘을 사용한다. 기존에 취약하다고 알려진 DES, RC5 등의 암호알고리즘을 대신하여, 3DES, AES, SEED 등의 안전한 암호알고리즘으로 대체하여 사용한다. 또한, 업무관련 내용, 개인정보 등에 대한 암호 알고리즘 적용시, IT보안인증 사무국이 안전성을 확인한 검증필 암호모듈을 사용해야한다. [ 참고 : 안전한 암호알고리즘 및 키 길이 ] 분류 보호함수 목록 최소 안전성 수준 112비트 블록암호 ARIA(키 길이 : 128/192/256), SEED(키 길이 : 128) 블록암호 운영모드 기밀성 ECD, CBC, CFB, OFB, CTR 기밀성/인증 CCM, GCM 해시함수 SHA-224/256/384/512 메시지 인증코드 해시함수기반 HMAC 블록기반 CMAC, GMAC 난수 발생기 해시함수 /HMAC 기반 HASH_DRBG, HMAC_DRBG 블록기반 CTR_DRBG 분류 보호함수 목록 공개키 암호 RSAES - (공개키 길이) 2048, 3072 - RSA-OAEP에서 사용되는 해시함수 : SHA-224/256 전자서명 RSA-PSS, KCDSA, ECDSA, EC-KCDSA 키 설정 방식 DH, ECDH 보호함수 보호함수 목록 시스템 파라미터 RSA-PSS (공개키 길이) 2048, 3072 KCDSA, DH (공개키 길이, 개인키 길이) (2048, 224), (2048, 256) ECDSA, EC￾KCDSA, ECDH (FIPS) B-233, B-283 (FIPS) K-233, K-283 (FIPS) P-224, P-256 [출처 : 암호알고리즘 검증기준 Ver 2.0(2012.3), 암호모듈시험기관]", "diag": "정적분석 도구 및 진단원이 각 언어에서 제공하는 암호화 함수가 취약한 암호화 알고리즘 사용 여부는 확인가능하나, 자체 암호화 알고리즘을 사용하는 경우 알고리즘의 적절성 여부를 판단하는 것은 어려우며, 수동진단이 필요하다. 자체 구현한 암호화 관련 알고리즘을 사용하는지 확인하고 자체 구현한 암호알고리즘을 사용할 경우 취약함으로 판단한다. 만약, 암호전문가가 존재할 경우 해당 암호함수의 암호알고리즘의 적절성을 판단하여 보증하는 것은 가능하다. 특정언어에서 제공하는 암호관련 함수를 호출하는지 식별한다. - 취약한 알고리즘 : RC2, RC4, RC5, RC6, MD4, MD5, SHA1, DES 등 - 안전한 알고리즘 : SHA-256, AES, SEED, ARIA 등"}, {"k": "2-5", "sec": 2, "name": "암호화되지 않은 중요정보", "pg": "p.337~348", "ans": "개인정보·금융정보·비밀번호 등 중요정보를 저장하거나 통신채널로 전송할 때는 반드시 암호화하고, 읽거나 쓸 때 권한 인증으로 적합한 사용자만 접근하도록 한다. 필요 시 SSL 또는 HTTPS 등 보안 채널을 사용하고, 쿠키에 중요 데이터를 저장하는 경우 setSecure(true) 등 보안속성을 설정한다.", "kw": ["저장·전송 시 암호화", "권한 인증", "SSL·HTTPS 보안 채널", "쿠키 보안속성(setSecure)"], "guard": "개인정보(주민등록번호, 여권번호 등), 금융정보(카드번호, 계좌번호 등), 비밀번호 등 중요정보를 저장하거나 통신채널로 전송할 때는 반드시 암호화 과정을 거쳐야 하며 중요정보를 읽거나 쓸 경우에 권한인증 등으로 적합한 사용자가 중요정보에 접근하도록 해야 한다. 필요한 경우 SSL 또는 HTTPS 등과 같은 보안 채널을 사용해야 하며, HTTPS와 같은 보안 채녈을 사용하거나 브라우저 쿠키에 중요 데이터를 저장하는 경우, 쿠키객체에 보안속성을 설정하여(Ex. setSecure(true)메소드 사용 등) 중요정보의 노출을 방지한다.", "diag": "ㆍ중요정보 평문저장 중요정보란 일반적으로 설계과정에서 결정되기 때문에, 중요정보의 평문저장을 일반적으로 검사 할 수 있는 기법은 존재하지 않는다. 따라서 이러한 정보를 저장하고 사용하는 경우 반드시는 암호화 및 복호화 과정을 거쳐야 한다. 다만, 로그인이나 암호의 사용과 같은 특정한 경우 해당 메소드의 인자 값 추적으로 평문 유무를 판단할 수 있다. 중요정보라고 판단된 데이터 경우에는 불필요한 참조가 존재하지 않도록 제거해야하며, 임의의 변수에 임시 저장할 경우에도 암호화 유무를 확인해야하며 사용이 완료된 임시변수의 값은 반드시 초기화 해주어야 한다. 또한, 쿠키에 값을 저장하는 경우에는 중요정보를 저장하지 않거나 또는 저장을 하더라도 암호화로 저장해야 한다. 다음 예제는 소켓 연결이 수립되고 난 후, 전달 받은 암호 값을 password_buffer에 저장하고 이를 다시 파일에 직접 기록하는 코드이다. 이 때, 전달받은 값을 암호화하지 않고 저장하기 때문에 해당 파일에 접근할 수 있는 사용자라면, 암호 값을 획득할 수 있다."}, {"k": "2-6", "sec": 2, "name": "하드코드된 중요정보", "pg": "p.350~359", "ans": "비밀번호는 암호화하여 별도의 파일에 저장하여 사용한다. 중요정보를 암호화할 때는 상수가 아닌 암호화 키를 사용하고, 소스코드 내부에 상수 형태의 암호화 키를 저장해 사용하지 않는다.", "kw": ["별도 파일에 암호화 저장", "소스코드 내 상수 키 금지"], "guard": "비밀번호는 암호화 하여 별도의 파일에 저장하여 사용한다. 또한 중요정보를 암호화하면, 상수가 아닌 암호화 키를 사용하도록 하며 소스코드 내부에 상수형태의 암호화 키를 저장해서 사용하지 않도록 한다.", "diag": "ㆍ하드코드된 비밀번호 사용자․관리자 로그인페이지(식별․인증)를 요청하는 모듈․함수를 확인하여 사용자․관리자 비밀번호가 소스코드 안에 직접 코딩되어 있는지 확인하고 내․외부 서버(업무서버, DB 등)에 접속을 관리하는 모듈 ․ 함수를 확인하여 서버 접속 비밀번호가 소스코드 안에 직접 코딩되어 있는지 확인한다. 비밀번호를 별도의 파일에 저장하여 사용하지 않고 소스코드 안에 하드코딩 되어 있는 경우엔 취약 하다고 판정한다. 다음의 예제에서 데이터베이스 접속 정보인 비밀번호를 4번 라인에서 입력하고 있다."}, {"k": "2-7", "sec": 2, "name": "충분하지 않은 키 길이 사용", "pg": "p.360~363", "ans": "RSA 알고리즘은 적어도 2,048비트 이상의 길이를 가진 키와 함께 사용하고, 대칭암호화 알고리즘의 경우 적어도 128비트 이상의 키를 사용한다.", "kw": ["RSA 2,048비트 이상", "대칭키 128비트 이상"], "guard": "RSA 알고리즘은 적어도 2,048 비트 이상의 길이를 가진 키와 함께 사용해야 하고, 대칭암호화 알고리즘 (Symmetric Encryption Algorithm)의 경우에는 적어도 128비트 이상의 키를 사용한다.", "diag": "대칭키 암호알고리즘(예,AES, ARID, SEED 등)의 경우 128bit 이상, 해시 함수(예, SHA 등)의 경우 128bit 이상, 공개키 암호알고리즘(예, RSA, DSA 등) 2,048bit 이상(ECC의 경우, 256 이상)의 키를 사용하는지 확인한다. 다음의 예제는 보안성이 강한 RSA 알고리즘을 사용함에도 불구하고, 키 사이즈를 작게 설정함으로써 프로그램의 취약점을 야기한 경우이다. 공개키 암호화에 사용하는 키의 길이는 적어도 2048비트 이상으로 설정한다."}, {"k": "2-8", "sec": 2, "name": "적절하지 않은 난수 값 사용", "pg": "p.364~368", "ans": "시드(Seed)값이 고정되면 매번 동일한 난수값이 발생하므로 매번 변경되는 시드값을 사용한다(C에서는 srand()로 현재시간 기반 시드 설정). 다만 세션 ID·암호화 키 등 보안결정을 위한 값에는 Random()과 Math.random()을 사용하지 말고 java.security.SecureRandom을 사용한다.", "kw": ["고정 시드값 금지", "srand()로 시드 변경", "보안결정에는 SecureRandom"], "guard": "컴퓨터의 난수발생기는 난수 값을 결정하는 시드(Seed)값이 고정될 경우, 매번 동일한 난수값이 발생한다. 이를 최대한 피하기 위해 Java에서는 Random()과 Math.random() 사용 시 java.util. Random 클래스에서 기본값으로 현재시간을 기반으로 조합하여 매번 변경 되는 시드(Seed)값을 사용하며, C에서는 rand()함수 사용 시 매번 변경되는 기본 시드(Seed)값이 없으므로, srand()로 매번 변경되는 현재시간 기반 등으로 시드(Seed)값을 설정 하여야 한다. 그러나 세션 ID, 암호화키 등 보안결정을 위한 값을 생성하고 보안결정을 수행하는 경우에는, Java 에서 Random()과 Math.random()을 사용하지 말아야 하며, 예측이 거의 불가능하게 암호학적으로 보호된 java.security.SecureRandom 클래스를 사용하는 것이 안전하다.", "diag": "Math.random() 메소드를 사용하는지 확인한다.(①), Math.random()을 사용하는 경우 취약하다. 난수값을 세션ID로 설정하여 보안결정에 사용하는지 확인한다(②). 보안 결정인 경우 java.security. SecureRandom을 사용하면 안전하다."}, {"k": "2-9", "sec": 2, "name": "취약한 비밀번호 허용", "pg": "p.370~374", "ans": "비밀번호 생성 시 강한 조건 검증을 수행한다. 비밀번호는 숫자와 영문자, 특수문자 등을 혼합하여 사용하고 주기적으로 변경하여 사용하도록 한다.", "kw": ["강한 조건 검증", "숫자·영문자·특수문자 혼합", "주기적 변경"], "guard": "비밀번호 생성 시 강한 조건 검증을 수행한다. 비밀번호(비밀번호)는 숫자와 영문자, 특수문자 등을 혼합하여 사용하고, 주기적으로 변경하여 사용하도록 해야 한다.", "diag": "비밀번호 생성 또는 변경 때 입력값을 다음과 같은 규칙으로 검사하는 모듈이 존재하는지 확인한다. ※ (참고) 안전한 비밀번호 조합규칙 - 영문자(대․소 구별), 숫자, 특수문자 조합하여, 비밀번호 길이는 8자리~10자리 이상 - 특정 패턴 및 사용자 ID 등을 비밀번호로 사용 금지 등 다음의 예제와 같이 사용자 계정 등록 등 비밀번호를 요구하는 정보 입력에서 널(Null) 체크, 비밀 번호의 자릿수, 특수문자 포함 등 비밀번호 요구 조건이 없거나 약하면 취약하다고 진단한다."}, {"k": "2-10", "sec": 2, "name": "부적절한 전자서명 확인", "pg": "p.375~377", "ans": "전자서명을 포함하는 파일을 사용할 때는 항상 전자서명을 확인한다. 전자서명 파일의 출처 등을 확인하여 신뢰할 수 없는 곳에서 생성된 파일을 사용하지 않는다.", "kw": ["항상 전자서명 확인", "출처 확인"], "guard": "전자서명을 포함하는 파일을 사용할 때는 항상 전자서명을 확인하여야 한다. 이 경우, 전자서명 파일의 출처 등을 확인하여 신뢰할 수 없는 곳에서 생성된 파일을 사용하지 않도록 한다.", "diag": "JarFile을 생성할 때 전자서명 여부를 확인하는 Boolean형 파라미터가 있는 생성자를 사용하여 전자 서명 여부를 검증하는지 확인한다. 또한 JarEntry.getCodeSigners() 메소드로 전자서명 주체 검증 여부를 확인한다."}, {"k": "2-11", "sec": 2, "name": "부적절한 인증서 유효성 검증", "pg": "p.379~381", "ans": "인증서를 사용하기 전에 인증서의 유효성을 확인한다. Common Name과 실제 호스트의 일치 여부, 신뢰된 발급기관(CA, RootCA)의 서명 여부, 유효기간, 해지 여부, 안전한 암호화 알고리즘 사용 여부를 확인하는 검증 절차를 구현한다.", "kw": ["Common Name·호스트 일치", "신뢰된 발급기관(CA) 서명", "유효기간·해지 여부"], "guard": "인증서를 사용하기 전에 인증서의 유효성을 확인한다. 인증서의 Common Name과 실제 호스트가 일치하는지, 신뢰된 발급기관(CA, RootCA)의 서명 여부, 인증서의 유효기간, 인증서의 해지여부, 안전한 암호화 알고리즘 사용 여부 확인 등으로 유효한 인증서인지 검증하는 절차를 구현하여야 한다.", "diag": "인증서를 확인하여(①), 검증결과 값이 X509_V_OK 이외의 값을 허용하는지 확인한다(②). 신뢰되지 않은 발급기관으로 받은 인증서를 허용하거나 유효기간이 만료된 인증서를 허용하면 위험하다. 또한 인증서의 Common Name 확인한다.(③)"}, {"k": "2-12", "sec": 2, "name": "사용자 하드디스크에 저장되는 쿠키를 통한 정보 노출", "pg": "p.382~385", "ans": "쿠키의 만료시간은 세션이 지속되는 시간을 고려하여 최소한으로 설정하고, 영속적인 쿠키에는 사용자 권한 등급·세션ID 등 중요정보가 포함되지 않도록 한다.", "kw": ["만료시간 최소한으로 설정", "영속 쿠키에 중요정보 금지"], "guard": "쿠키의 만료시간은 세션이 지속되는 시간을 고려하여 최소한으로 설정하고 영속적인 쿠키에는 사용자 권한 등급, 세션ID 등 중요정보가 포함되지 않도록 한다.", "diag": "사용자 브라우저로 쿠키를 전송하는지 확인하고(①), 쿠키 유효기간 확인한다(②). 쿠키 설정 값에 id 정보 등 중요 정보 포함 여부를 확인한다(③)"}, {"k": "2-13", "sec": 2, "name": "주석문 안에 포함된 시스템 주요정보", "pg": "p.386~389", "ans": "주석에는 ID, 비밀번호 등 보안과 관련된 내용을 기입하지 않는다.", "kw": ["주석 내 ID·비밀번호 기입 금지"], "guard": "주석에는 ID, 비밀번호 등 보안과 관련된 내용을 기입하지 않는다.", "diag": "DB접속, 관리자 로그인 등이 구현된 코드를 확인하고(①), 주석을 확인하여 암호 포함여부 확인한다 (②)."}, {"k": "2-14", "sec": 2, "name": "솔트 없이 일방향 해쉬 함수 사용", "pg": "p.390~393", "ans": "비밀번호 저장 시 비밀번호와 솔트를 해시함수에 함께 입력하여 얻은 해시값을 저장한다.", "kw": ["비밀번호+솔트 함께 해시", "해시값 저장"], "guard": "비밀번호를 저장시 비밀번호와 솔트를 해시함수에 함께 입력하여 얻은 해시값을 저장한다.", "diag": "getInstance 함수로 안전한 해시 알고리즘을 인자로 하여 MessageDigest 객체를 생성하는지 확인 하고(①), 해시 값을 반환(②) 하기 전에 update 함수에 솔트를 사용하여 데이터를 해시하는지 확인한다. 다음의 예제에서는 MessageDigest 객체를 생성하고 솔트 없이 해시 값을 반환하고 있으므로 취약 하다고 판정한다."}, {"k": "2-15", "sec": 2, "name": "무결성 검사 없는 코드 다운로드", "pg": "p.394~399", "ans": "DNS 스푸핑을 방어할 수 있는 DNS lookup을 수행하고, 코드 전송 시 신뢰할 수 있는 암호 기법을 이용하여 코드를 암호화한다. 다운로드한 코드는 작업 수행에 필요한 최소한의 권한으로 실행한다.", "kw": ["DNS 스푸핑 방어", "코드 암호화 전송", "최소한의 권한으로 실행"], "guard": "DNS 스푸핑(Spoofing)을 방어할 수 있는 DNS lookup을 수행하고 코드 전송시 신뢰할 수 있는 암호 기법을 이용하여 코드를 암호화한다. 또한 다운로드한 코드는 작업 수행을 위해 필요한 최소한의 권한으로 실행하도록 한다.", "diag": "클래스를 로드하기 위한 코드를 확인(①)하고 클래스를 로드하기 전에 체크섬을 실행 및 비교하여 로드하려는 코드가 변조되지 않았음을 확인하다. 다음의 예제에서는 로드하려는 클래스의 체크섬을 비교하여 무결성을 확인하고 있지 않으므로 취약하다고 판정한다."}, {"k": "2-16", "sec": 2, "name": "반복된 인증시도 제한 기능 부재", "pg": "p.400~404", "ans": "인증시도 횟수를 적절한 횟수로 제한하고, 설정된 인증실패 횟수를 초과했을 경우 계정을 잠금하거나 추가적인 인증과정을 거쳐 시스템에 접근할 수 있도록 한다.", "kw": ["인증시도 횟수 제한", "계정 잠금", "추가 인증과정"], "guard": "인증시도 횟수를 적절한 횟수로 제한하고 설정된 인증실패 횟수를 초과했을 경우 계정을 잠금하거나 추가적인 인증과정을 거쳐서 시스템에 접근이 가능하도록 한다.", "diag": "인증을 위한 함수를 호출하는 경우, 이 함수의 호출 횟수를 확인하고 함수의 호출을 제한하는 코드가 존재하는지 확인한다. 그렇지 않은 경우는 취약하다고 판단한다. 다음 예제는 인증을 시도를 할 때, 인증 시도에 대한 제한 없이 반복문 안에서 계속 인증 시도를 하는 코드이다. 인증 시도 회수에 대한 검사 루틴이 존재하지 않으므로 보안약점이 존재하는 코드라고 진단할 수 있다."}, {"k": "3-1", "sec": 3, "name": "경쟁조건: 검사 시점과 사용 시점(TOCTOU)", "pg": "p.407~413", "ans": "공유자원을 여러 프로세스가 접근하여 사용할 경우 synchronized, mutex 등 동기화 구문을 사용하여 한 번에 하나의 프로세스만 접근 가능하도록 한다. 성능에 미치는 영향을 최소화하기 위해 임계코드 주변만 동기화 구문을 사용한다.", "kw": ["동기화 구문(synchronized·mutex)", "한 번에 하나의 프로세스만 접근", "임계코드 주변만"], "guard": "공유자원(예: 파일)을 여러 프로세스가 접근하여 사용할 경우, 동기화 구문을 사용하여 한 번에 하나의 프로세스만 접근 가능하도록(synchronized, mutex 등) 하는 한편, 성능에 미치는 영향을 최소화하기 위해 임계코드 주변만 동기화 구문을 사용한다.", "diag": "소스코드 상에 다음과 같이 공유자원(파일/폴더, 소켓, 드라이버 등)을 여러 프로세스가 사용하는지 확인한다(①). 이 때, 하나의 공유자원을 동시에 접근할 가능성이 존재한다면 취약하다고 판단하며, 동기화 구문 등을 사용할 경우 안전하다고 판단한다. 그 외 공유자원 억세스를 관리하는 pool 형태의 자체 모듈을 제작할 경우에도 안전하다고 판단한다."}, {"k": "3-2", "sec": 3, "name": "종료되지 않는 반복문 또는 재귀 함수", "pg": "p.415~418", "ans": "모든 재귀 호출 시 재귀 호출 횟수를 제한하거나 초기값을 상수로 설정하여 재귀 호출을 제한한다.", "kw": ["재귀 호출 횟수 제한", "초기값(상수) 설정"], "guard": "모든 재귀 호출시, 재귀 호출 횟수를 제한하거나, 초기값을 설정(상수)하여 재귀 호출을 제한해야 한다.", "diag": "자신을 호출하는 재귀함수나 메소드가 존재하는지 식별하고, 해당 함수 내에 제어문으로 해당 함수에 서 리턴될 수 있는지 확인한다. 제어문으로 재귀함수를 빠져나올 수 있으면 안전하다."}, {"k": "4-1", "sec": 4, "name": "오류 메시지 정보노출", "pg": "p.419~423", "ans": "오류 메시지는 정해진 사용자에게 유용한 최소한의 정보만 포함하도록 한다. 예외상황은 소스코드에서 내부적으로 처리하고, 사용자에게는 민감한 정보를 포함하지 않는 미리 정의된 메시지를 제공한다.", "kw": ["최소한의 정보만 포함", "예외상황 내부 처리", "미리 정의된 메시지"], "guard": "오류 메시지는 정해진 사용자에게 유용한 최소한의 정보만 포함하도록 한다. 소스코드에서 예외상황은 내부적으로 처리하고 사용자에게 민감한 정보를 포함하는 오류를 출력하지 않도록 미리 정의된 메시지를 제공하도록 설정한다.", "diag": "해당 취약점에서 시스템 환경, 유저정보, 민감한 정보 등에 대한 기준을 정적도구가 판단하기 어려움에 따라 진단원이 출력함수 등으로 외부에 출력되는 값 중 민감한 정보 등을 판단할 필요가 있다. 오류메 시지를 출력하는 경우(①) 해당오류에 시스템 환경, 유저정보, 데이터 등 민감한 정보가 포함되어 있는지 확인한다."}, {"k": "4-2", "sec": 4, "name": "오류상황 대응 부재", "pg": "p.425~427", "ans": "오류가 발생할 수 있는 부분에 대하여 제어문을 사용하여 적절하게 예외 처리를 한다(C/C++에서 if와 switch, Java에서 try-catch 등).", "kw": ["제어문으로 예외 처리", "if·switch / try-catch"], "guard": "오류가 발생할 수 있는 부분에 대하여 제어문을 사용하여 적절하게 예외 처리(C/C++에서 if와 switch, Java에서 try-catch 등)를 한다.", "diag": "오류가 발생할 수 있는 부분에 대하여 예외처리를 수행했는지 확인하고 제어문으로 예외 처리하는 루틴 이 비어있는지 확인한다. 다음의 예제는 try 블록에서 발생하는 오류를 포착(catch)하고 있지만 그 오류에 대해서 아무 조치를 하고 있지 않다. 따라서 프로그램이 계속 실행되기 때문에 프로그램에서 어떤 일이 일어났는지 전혀 알 수 없게 된다."}, {"k": "4-3", "sec": 4, "name": "부적절한 예외 처리", "pg": "p.429~431", "ans": "값을 반환하는 모든 함수의 결과값을 검사하여 의도했던 값인지 확인하고, 예외 처리를 사용하는 경우 광범위한 예외 처리 대신 구체적인 예외 처리를 수행한다.", "kw": ["반환값 검사", "광범위한 예외 대신 구체적인 예외 처리"], "guard": "값을 반환하는 모든 함수의 결과값을 검사하여, 그 값이 의도했던 값인지 검사하고, 예외 처리를 사용 하는 경우에 광범위한 예외 처리 대신 구체적인 예외 처리를 수행한다.", "diag": "함수 또는 메소드에 대하여 반환값을 검사하고 예외를 발생시키는 경우(①) 구체적인 예외처리를 수행하는지 확인한다."}, {"k": "5-1", "sec": 5, "name": "Null Pointer 역참조", "pg": "p.433~444", "ans": "널이 될 수 있는 레퍼런스는 참조하기 전에 널 값인지를 검사하여 안전한 경우에만 사용한다.", "kw": ["참조 전 널 값 검사"], "guard": "널이 될 수 있는 레퍼런스(Reference)는 참조하기 전에 널 값인지를 검사하여 안전한 경우에만 사용 한다.", "diag": "표현된 객체가 널(Null) 값이 될 수 있는지 확인한다. 만약 널(Null) 값이 될 수 있는지 체크하여 예외 처리를 한 경우 안전으로 판단하고 널(Null) 체크를 하지 않은 경우 취약한 것으로 판단한다. (①)"}, {"k": "5-2", "sec": 5, "name": "부적절한 자원 해제", "pg": "p.445~453", "ans": "자원을 획득하여 사용한 다음에는 반드시 자원을 해제하여 반환한다.", "kw": ["사용 후 반드시 해제·반환"], "guard": "자원을 획득하여 사용한 다음에는 반드시 자원을 해제하여 반환한다.", "diag": "자원(파일기술자, 힙메모리, 소켓)이 선언되고, 선언된 자원이 할당된 경우 해제되는지 확인한다. 진단자는 제어문, 예외처리문 등의 분기 등에 따라 모든 흐름(control flow)을 판단하여 자원해제 여부를 체크해야 한다. 할당된 자원이 해제될 경우 안전하다고 판단하고 자원이 해제되지 않는 분기가 존재할 경우 취약하다."}, {"k": "5-3", "sec": 5, "name": "해제된 자원 사용", "pg": "p.454~456", "ans": "동적으로 할당된 메모리를 해제한 후 그 메모리를 참조하던 포인터를 참조 추적·형 변환·수식의 피연산자 등으로 사용하여 해제된 메모리에 접근하지 않는다. 메모리 해제 후 포인터에 널(Null)값이나 다른 적절한 값을 저장하면 의도하지 않은 코드의 실행을 막을 수 있다.", "kw": ["해제된 메모리 접근 금지", "해제 후 포인터에 NULL 저장"], "guard": "동적으로 할당된 메모리를 해제한 후 그 메모리를 참조하고 있던 포인터를 참조 추적이나 형 변환, 수식에서의 피연산자 등으로 사용하여 해제된 메모리에 접근하도록 해서는 안된다. 또한, 메모리 해제 후, 포인터에 널(Null)값을 저장하거나 다른 적절한 값을 저장하면 의도하지 않은 코드의 실행을 막을 수 있다.", "diag": "소스코드 상에 메모리나 파일과 같은 자원을 사용하는 코드를 사용하는지 확인한다. 이 때, 자원을 사용하는 코드의 앞에서 자원의 해제가 발생하면 취약하다고 판단하며, 자원의 해제 후 모든 경우의 제어 흐름이 자원을 사용하는 코드로 도달하지 않을 경우 안전하다고 판단한다. 또한 자원을 참조 하는 포인터변수에 연산 작업을 수행하는 경우 보다 정밀하게 올바른 값을 참조하는지 검사해야 하며, 사용이 완료된 포인터 변수의 초기화가 이루어지는지 확인한다. 다음 예제는 할당된 메모리를 해제한 후 다시 접근하는 예제로, 21번 라인에서 실행되는 if문에서 messageBody에 할당된 메모리를 해지하였지만, 32번 라인에서 다시 해당 변수에 접근하고 있으므로, 보안약점이 존재하는 코드라고 판단한다. 또한 사용이 완료된 변수는 반드시 널(Null) 값으로 초기화 해주도록 한다."}, {"k": "5-4", "sec": 5, "name": "초기화되지 않은 변수 사용", "pg": "p.459~460", "ans": "초기화되지 않은 스택 메모리 영역의 변수는 이전 함수에서 사용되었던 내용을 포함하고 있어 공격자가 값을 읽거나 특정 코드를 실행할 수 있으므로, 모든 변수를 사용 전에 반드시 올바른 초기값으로 할당한다.", "kw": ["사용 전 초기값 할당", "이전 함수의 잔존 값"], "guard": "초기화되지 않은 스택 메모리 영역의 변수는 임의값이라 생각해서 대수롭지 않게 생각할 수 있으나 사실은 이전 함수에서 사용되었던 내용을 포함하고 있다. 공격자는 이러한 약점을 사용하여 메모리 에 저장되어 있는 값을 읽거나 특정 코드를 실행할 수 있다. 모든 변수를 사용 전에 반드시 올바른 초기 값을 할당함으로서 이러한 문제를 예방한다.", "diag": "변수의 선언과 동시에 초기화가 이루어지는지 확인한다. C++ 언어와 같이 객체의 필드가 초기 값을 가지지 않는 경우에는 생성자로 필드의 초기화가 이루어지는지 확인한다. 이와 같은 작업이 이루어 지지 않을 경우에는 기본적으로 취약하다고 판단한다. 다음 예제는 C++ 코드로, 디폴트 생성자에서 필드의 초기화가 이루어지지 않기 때문에 디폴트 생성자를 이용할 경우 필드는 임의의 값을 가진다. 따라서 다음 예는 초기화되지 않은 필드에 접근하여 값을 가져오게 되므로 보안약점이 존재하는 코드라고 진단할 수 있다."}, {"k": "5-5", "sec": 5, "name": "신뢰할 수 없는 데이터의 역직렬화", "pg": "p.463~468", "ans": "신뢰할 수 없는 데이터를 역직렬화하지 않도록 응용프로그램을 구성한다. 암호화 통신을 적용하지 못하는 경우 송신 측에서 서명을 추가하고 수신 측에서 서명을 확인하여 무결성을 검증하며, 역직렬화 대상이 사전에 검증된 클래스만 포함하는지 검증하거나 제한된 실행 권한으로 역직렬화 코드를 실행한다.", "kw": ["신뢰할 수 없는 데이터 역직렬화 금지", "서명 추가·확인(무결성 검증)", "검증된 클래스만 허용", "제한된 실행 권한"], "guard": "신뢰할 수 없는 데이터를 역직렬화 하지 않도록 응용프로그램을 구성한다. 민감정보 또는 중요정보를 전송 시 암호화 통신을 적용하지 못하는 경우, 송신 측에서 서명을 추가하고 수신 측에서 서명을 확인 하여 데이터의 무결성을 검증한다. 또는, 신뢰할 수 있는 데이터의 식별을 위해 역직렬화 대상의 데이터가 사전에 검증된 클래스만을 포함하는지 검증하거나, 제한된 실행 권한을 구성하여 역직렬화 코드를 실행한다.", "diag": "java.io.ObjectInputStream.readObject()와 같이 각 언어에서 제공하는 역직렬화 함수를 확인하고 (①), 해당 역직렬화 함수에서 사용하는 데이터가 신뢰할 수 있는 값인지 확인한다(②). 만약 사용자 입력 값, 소켓으로 입력받은 값 등 출처를 신뢰할 수 없는 데이터를 검증하는 절차가 없 으면 취약하다고 판정한다."}, {"k": "6-1", "sec": 6, "name": "잘못된 세션에 의한 데이터 정보 노출", "pg": "p.469~475", "ans": "싱글톤 패턴을 사용하는 경우 변수 범위(Scope)에 주의한다. Java에서는 HttpServlet 클래스의 하위클래스에서 멤버 필드를 선언하지 않도록 하고, 필요한 경우 지역 변수를 선언하여 사용한다.", "kw": ["싱글톤·변수 범위(Scope)", "HttpServlet 하위클래스 멤버 필드 금지", "지역 변수 사용"], "guard": "싱글톤 패턴을 사용하는 경우, 변수 범위(Scope)에 주의를 기울여야 한다. 특히 Java에서는 HttpServ -let 클래스의 하위클래스에서 멤버 필드를 선언하지 않도록 하고, 필요한 경우 지역 변수를 선언하여 사용한다.", "diag": "HttpServlet의 하위클래스에 멤버필드가 선언되어 있고 final이 아닌 경우는 취약한 것으로 판단한다."}, {"k": "6-2", "sec": 6, "name": "제거되지 않고 남은 디버그 코드", "pg": "p.476~479", "ans": "소프트웨어 배포 전에 반드시 디버그 코드를 확인 및 삭제한다. 디버깅이 끝나면 디버그 용도로 작성한 main() 메서드를 삭제한다.", "kw": ["배포 전 디버그 코드 확인·삭제", "main() 메서드 삭제"], "guard": "소프트웨어 배포 전, 반드시 디버그 코드를 확인 및 삭제한다. 일반적으로 Java 개발자의 경우 웹 응용 프로그램을 제작할 때 디버그 용도의 코드를 main()에 개발한 후 이를 삭제하지 않는 경우가 많다. 디버깅이 끝나면 main() 메서드를 삭제해야 한다.", "diag": "J2EE를 제외하고 디버그 코드를 정적도구만으로 판단하기는 쉽지 않다. 개발 중 테스트 목적으로 남아 있는 디버그 코드가 존재하는지 확인한다(①). J2EE 환경(J2EE Standard)에서는 main 메소드 작성을 금하고 있으며, 일반적으로 개발자들은 디버그 코드를 main 으로 작성하므로 main 메소드가 사용되는 경우 디버그코드 인지 확인하여야 한다."}, {"k": "6-3", "sec": 6, "name": "Public 메소드부터 반환된 Private 배열", "pg": "p.481~485", "ans": "private로 선언된 배열을 public으로 선언된 메소드로 반환하지 않는다. private 배열의 복사본을 반환하고 배열의 원소는 clone() 메소드로 복사된 원소를 저장하도록 하여 의도하지 않은 수정을 방지한다.", "kw": ["복사본을 반환", "clone() 메소드", "의도하지 않은 수정 방지"], "guard": "private로 선언된 배열을 public으로 선언된 메소드로 반환하지 않도록 해야 한다. private 배열에 대한 복사본을 반환하도록 하고 배열의 원소에 대해서는 clone() 메소드로 복사된 원소를 저장하도록 하여 private 선언된 배열과 객체속성에 대한 의도하지 않게 수정되는 것을 방지한다. 만약 배열의 원소가 String 타입 등과 같이 변경이 되지 않는 경우에는 Private 배열의 복사본을 만들고 이를 반환하 도록 작성한다.", "diag": "private 배열이 선언되어 있는지 확인하고(①), 해당 배열이 public 메소드에서 반환될 경우 취약하다고 판단한다(②). 이때 선언된 private 배열의 원소가 일반 객체일 경우 각 원소별로 객체를 생성하고 객체 내부의 값을 복사하는지 확인한다."}, {"k": "6-4", "sec": 6, "name": "Private 배열에 Public 데이터 할당", "pg": "p.487~491", "ans": "public으로 선언된 메서드의 인자를 private으로 선언된 배열에 그대로 저장하지 않는다. 인자로 들어온 배열의 복사본을 생성하고 clone() 메소드로 복사된 원소를 private 변수에 할당하여 의도하지 않은 수정을 방지한다.", "kw": ["인자 배열의 복사본 생성", "clone() 메소드", "의도하지 않은 수정 방지"], "guard": "public으로 선언된 메서드의 인자를 private선언된 배열로 저장되지 않도록 한다. 인자로 들어온 배열의 복사본을 생성하고 clone() 메소드로 복사된 원소를 저장하도록 하여 private변수에 할당 하여 private선언된 배열과 객체속성에 대한 의도하지 않게 수정되는 것을 방지한다. 만약 배열 객체 의 원소가 String 타입 등과 같이 변경이 되지 않는 경우에는 인자로 들어온 배열의 복사본을 생성 하여 할당한다.", "diag": "private 배열이 선언되어 있는지 확인하고(①), public 메소드의 인자로 받은 배열을 private 배열 필드에 직접 할당할 경우 취약하다고 판단한다(②). 이때 선언된 private 배열의 원소가 일반 객체일 경우 각 원소별로 객체를 생성하고 객체 내부의 값을 복사하는지 확인한다. userRoles 필드는 private이지만, public인 setUserRoles()로 외부의 배열이 할당되면, 사실상 public 필드가 된다."}, {"k": "7-1", "sec": 7, "name": "DNS lookup에 의존한 보안결정", "pg": "p.492~495", "ans": "보안결정에서 도메인명을 이용한 DNS lookup을 하지 않도록 한다.", "kw": ["보안결정에 DNS lookup 사용 금지", "도메인명 의존 금지"], "guard": "보안결정에서 도메인명을 이용한 DNS lookup을 하지 않도록 한다.", "diag": "DNS lookup을 하는 모듈이 존재하는지 확인하고(①), 보안결정을 하는 부분이 존재하는지 확인 한다(②). DNS 이름으로 해당 요청이 신뢰할 수 있는지를 검사한다. 그러나 공격자가 DNS 캐시 등 을 조작하면 잘못된 신뢰 상태 정보를 얻을 수 있다."}, {"k": "7-2", "sec": 7, "name": "취약한 API 사용", "pg": "p.497~501", "ans": "보안 문제로 인해 금지된 함수는 이를 대체할 수 있는 안전한 함수를 사용한다(strcat_s(), strcpy_s(), strncat_s(), strncpy_s(), sprintf_s() 등). 개발 조직에서 취약한 API를 명시한 경우 반드시 준수한다.", "kw": ["금지 함수 대신 안전한 함수", "strcpy_s()·strncat_s() 등 _s 계열", "조직이 명시한 취약 API 준수"], "guard": "보안 문제로 인해 금지된 함수는 이를 대체할 수 있는 안전한 함수를 사용한다. 그 예로, 위에 언급된 API 대신에 strcat_s(), strcpy_s(), strncat_s(), strncpy_s(), sprintf_s()과 같은 안전한 함수를 사용하는 것이 권장된다. 또한 금지된 API는 아니지만 취약한 API의 예시로, 문자열을 정수로 변환 할 때 사용하는 strtol()과 같은 함수는 작은 크기의 부호 있는 정수인 int, short, char와 같은 자료형 변환에 사용하면 범위 제한 없이 값을 평가할 수 있다. 취약한 API의 분류는 일반적인 것은 아니지만 개발 조직에 따라 이를 명시한 경우가 있다면 반드시 준수한다.", "diag": "취약한 API의 리스트를 작성하고 검사하고자 하는 프로그램에서 해당 API를 사용하는지 확인한다. 해당 API를 사용하는 경우 프로그램에 예기치 않은 문제가 발생할 수 있으므로 취약한 것으로 판단한다. 만약 취약한 API를 대체할 수 있는 API가 없을 경우, 해당 API의 인자와 반환 값에 대한 검사가 이루어 지는지 확인한다. 다음 예제는 함수의 매개변수를 버퍼에 복사하는 코드이다. 예제에서 버퍼에 값을 복사하기 위해 사용한 strcpy() 함수는 보안에서 취약한 대표적인 API중 하나로, 만약 매개 변수의 길이가 지정된 버퍼의 크기보다 클 경우 예기치 못한 문제가 발생 할 수가 있다. 따라서 해당 코드는 보안약점이 존재한다고 진단할 수 있다."}], "secn": {"1": "입력데이터 검증 및 표현", "2": "보안기능", "3": "시간 및 상태", "4": "에러처리", "5": "코드오류", "6": "캡슐화", "7": "API 오용"}};
const DBD = {"d":[{"k":"SR1-1","sec":1,"name":"DBMS 조회 및 결과 검증","pg":"통합 수험서 제2장","ans":"DB 연동 기능에서 외부 입력값이 SQL 구문의 «구조»를 바꾸지 못하도록 검증·바인딩하는 방법과, 조회 결과·오류가 내부정보를 노출하지 않도록 하는 방법을 설계 단계에서 정의할 것을 요구하는 기준임.","kw":["파라미터 검증·필터링","Prepared Statement(바인딩)","오류 시 내부정보 미노출"],"guard":"문자열 결합에 의한 동적 쿼리 조립을 금지하고, **Prepared Statement 등 바인딩** 방식으로 컴파일된 쿼리문에 파라미터를 전달하는 구조를 설계에 명시함\nSQL문에 사용되는 외부입력값의 **특수문자·쿼리 예약어 필터링** 규칙을 정의함(화이트리스트 우선)\n매퍼 프레임워크 사용 시 치환(`${}`)이 아닌 바인딩(`#{}`) 사용을 코딩표준으로 규정함\nDB 접속 계정에 최소권한을 부여하고, 조회 결과 중 중요정보는 마스킹·암호화 정책을 정의함\nDB **오류 발생 시 내부정보(SQL문·테이블·스택트레이스)를 노출하지 않고** 사전 정의된 오류 메시지로 대체하며, 상세 내역은 서버 로그에만 기록함","diag":"SQL문 파라미터 검증·필터링, Prepared Statement(바인딩), 오류 시 내부정보 미노출","impl":["1-1 SQL 삽입"]},{"k":"SR1-2","sec":1,"name":"XML 조회 및 결과 검증","pg":"통합 수험서 제2장","ans":"XML 데이터를 조회(XPath·XQuery)할 때 외부 입력값이 조회 구문을 변조하지 못하게 하고, XML 파서가 외부 개체를 처리하지 않도록 설계할 것을 요구하는 기준임.","kw":["XPath","XQuery 파라미터 검증","외부개체(External Entity) 사용 제한","특수문자 필터링"],"guard":"**XPath/XQuery 파라미터 검증** — 조회 구문에 들어가는 외부입력의 **특수문자**(`' [ ] ,` 등)·쿼리 예약어를 필터링함\n파라미터화된 XQuery(변수 선언 후 바인딩) 사용을 설계 표준으로 규정함\nXML 파서의 DTD 처리와 **외부개체(External Entity) 사용을 제한**(비활성화)하는 것을 기본 설정으로 정의함\n조회 결과에 포함되는 중요정보의 반환 범위를 최소화함","diag":"XPath/XQuery 파라미터 검증, 외부개체(External Entity) 사용 제한","impl":[]},{"k":"SR1-3","sec":1,"name":"디렉토리 서비스 조회 및 결과 검증","pg":"통합 수험서 제2장","ans":"LDAP 등 디렉토리 서비스 조회 시 DN 과 검색 필터에 삽입되는 외부 입력값의 유효성 검증 방법을 설계할 것을 요구하는 기준임.","kw":["LDAP 검색 입력값 필터링","특수문자 제한","DN·검색 필터"],"guard":"**LDAP 검색 입력값 필터링** — 화이트리스트 정규식으로 허용 문자만 통과시킴\nDN·검색 필터에 사용되는 **특수문자**(`* ( ) = + \u003c > # ; \\` 등)를 제거하거나, 실행 명령이 아닌 일반문자로 인식되도록 처리함\n디렉토리 바인딩 계정에 최소권한을 부여하고, 반환 속성을 업무에 필요한 항목으로 한정함\n검색 실패·오류 시 디렉토리 구조가 드러나는 메시지를 노출하지 않음","diag":"LDAP 검색 입력값 필터링, 특수문자 제한","impl":[]},{"k":"SR1-4","sec":1,"name":"시스템 자원 접근 및 명령어 수행 입력값 검증","pg":"통합 수험서 제2장","ans":"파일·소켓 등 시스템 자원의 식별자나 OS 명령어에 외부 입력값이 사용될 때의 검증 방법을 설계할 것을 요구하는 기준임.","kw":["경로조작 문자(..",") 필터링","OS 명령어 화이트리스트","자원 접근 제한"],"guard":"파일 경로에 사용되는 입력값에서 **경로조작 문자(`../`, `..`, `/`, `\\`)를 필터링**하거나 제거함\n자원 식별자는 사전에 정의된 목록(화이트리스트)에서 선택되도록 설계하고, 외부입력을 그대로 식별자로 쓰지 않음\n**OS 명령어와 인자는 화이트리스트**로 한정하고, 외부입력을 명령어 문자열에 직접 결합하지 않음\n응용프로그램 실행 계정과 **자원 접근 권한을 최소권한으로 제한**함","diag":"경로조작 문자(../ 등) 필터링, OS 명령어 화이트리스트, 자원 접근 제한","impl":[]},{"k":"SR1-5","sec":1,"name":"웹 서비스 요청 및 결과 검증","pg":"통합 수험서 제2장","ans":"웹 화면으로 입력·출력되는 값에 스크립트가 삽입되어 사용자 브라우저에서 실행되지 않도록(XSS 방지) 검증 방법을 설계할 것을 요구하는 기준임.","kw":["입력·출력값 검증","스크립트 무력화(인코딩)","XSS 방지"],"guard":"**입력값 검증** — 서버측에서 허용 문자 집합·길이를 검증하고 위험 문자를 치환·제거함\n**출력값 검증** — 화면 출력 시 `& \u003c > \" ' ( )` 등을 HTML 엔티티로 인코딩하여 **스크립트를 무력화**함\nHTML 태그 입력을 허용해야 하는 게시판 등은 **허용 태그 화이트리스트**를 정의함\n검증된 XSS 방지 라이브러리·프레임워크 사용을 설계 표준으로 규정함","diag":"XSS 방지 — 입력·출력값 검증, 스크립트 무력화(인코딩)","impl":[]},{"k":"SR1-6","sec":1,"name":"웹 기반 중요기능 수행 요청 유효성 검증","pg":"통합 수험서 제2장","ans":"등록·수정·삭제·이체 등 중요기능 요청이 **정상적인 절차를 거친 요청인지 확인**하는 방법을 설계할 것을 요구하는 기준임(CSRF 방지).","kw":["토큰","재인증","요청 정상 여부 확인"],"guard":"입력 화면과 처리 프로그램 사이에 **토큰**(세션에 저장한 값과 요청 파라미터 값을 비교)을 사용하여 외부에서 URL 을 직접 호출한 요청을 차단함\n중요기능은 세션 검증에 더해 **재인증**(비밀번호·2차 인증)을 요구하도록 설계함\n입력 폼은 GET 대신 POST 방식을 사용하고, **요청의 정상 여부 확인** 절차를 처리 로직 앞단에 배치함\n보조 수단으로 **Referer 검증**을 병행함(근거: 통합 수험서 제2장 구현단계 1-11 대응책 「CSRF 토큰, 재인증, Referer 검증」). 다만 설계 기준 표의 핵심 키워드는 아래 셋이므로 **토큰·재인증·요청 정상 여부 확인을 먼저 쓸 것**","diag":"CSRF 방지 — 토큰, 재인증, 요청 정상 여부 확인","impl":["1-11 크로스사이트 요청 위조"]},{"k":"SR1-7","sec":1,"name":"HTTP 프로토콜 유효성 검증","pg":"통합 수험서 제2장","ans":"HTTP 요청·응답의 헤더와 이동 주소에 외부 입력값이 반영될 때의 검증 방법을 설계할 것을 요구하는 기준임.","kw":["응답분할(CR","LF) 방지","리다이렉트 URL 화이트리스트","헤더 검증"],"guard":"응답헤더(Set-Cookie 등)에 외부입력을 포함할 경우 **CR/LF 개행문자를 제거**하여 **응답분할**을 방지함\n자동 이동에 사용되는 **리다이렉트 URL·도메인을 화이트리스트**로 관리하고, 입력값이 목록에 존재할 때만 이동함\n요청 **헤더 검증** — 허용 메서드·Content-Type·길이 제한을 정의함. Referer 등 클라이언트가 보낸 헤더는 **보조 수단**으로만 쓰고 단독 근거로 삼지 않음 `[가정]` — 근거 문서는 CSRF 대책으로 「Referer 검증」을 열거할 뿐 단독 사용 여부를 언급하지 않음. **문항 6(CSRF)에서 「Referer 검증」을 쓰는 것은 감점 사유가 아님**","diag":"응답분할(CR/LF) 방지, 리다이렉트 URL 화이트리스트, 헤더 검증","impl":[]},{"k":"SR1-8","sec":1,"name":"허용된 범위 내 메모리 접근","pg":"통합 수험서 제2장","ans":"할당된 메모리 범위를 벗어난 읽기·쓰기가 발생하지 않도록 버퍼 크기 설정과 경계 검증 방법을 설계할 것을 요구하는 기준임.","kw":["버퍼오버플로우 방지","배열 경계","포맷스트링 검증"],"guard":"메모리 버퍼의 **적절한 크기를 설정**하고, 설정된 범위 내에서만 읽고 쓰도록 통제하는 규칙을 정의함(**버퍼오버플로우 방지**)\n복사·입력 시 «대상 버퍼»의 크기를 기준으로 길이를 제한하고, 길이 검증 없는 함수(gets, strcpy 등) 사용을 금지 목록으로 규정함\n문자열 저장 시 **널(Null) 문자를 버퍼 범위 내에 삽입**하여 종료되도록 함\n**배열 인덱스의 경계**와 반복 횟수를 사용 전에 검증하고, 길이 계산에 정수형 오버플로우가 발생하지 않도록 자료형·부호를 검토함\n외부 입력값을 **포맷스트링**(형식 문자열) 위치에 직접 전달하지 않도록 설계함","diag":"버퍼오버플로우 방지, 배열 경계·포맷스트링 검증","impl":["1-16 메모리 버퍼 오버플로우","1-17 포맷 스트링 삽입"]},{"k":"SR1-9","sec":1,"name":"보안기능 입력값 검증","pg":"통합 수험서 제2장","ans":"인증·권한부여 등 보안기능이 사용하는 입력값과 함수의 **수행결과(리턴값)** 에 대한 유효성 검증 방법을 설계할 것을 요구하는 기준임.","kw":["쿠키·히든필드","서버측 검증","리턴값(수행결과) 유효성 검증"],"guard":"**쿠키·히든필드**·환경변수 등 사용자가 조작할 수 있는 값을 인증·인가·가격 등 보안결정의 근거로 사용하지 않음\n상태정보·세션정보 등 중요 데이터는 서버에 저장하고, 보안확인 절차도 **서버측에서 검증**하도록 설계함(클라이언트 검증은 우회 가능하다는 전제)\n부득이 클라이언트에 전달해야 하는 값은 암호화·무결성 체크를 적용함\n보안기능 함수의 **리턴값(수행결과)이 의도한 값인지 검사**하는 절차를 설계에 포함함","diag":"보안기능(인증·권한부여 등) 입력값과 함수(리턴값 포함)의 외부입력값·수행결과에 대한 유효성 검증방법 설계 — 쿠키·히든필드 등 서버측 검증","impl":["1-15 보안기능 결정에 사용되는 부적절한 입력값"]},{"k":"SR1-10","sec":1,"name":"업로드·다운로드 파일 검증","pg":"통합 수험서 제2장","ans":"서버로 업로드되거나 서버에서 내려받는 파일에 대한 검증·저장 방법을 설계할 것을 요구하는 기준임.","kw":["확장자·크기·개수 제한","저장경로 분리","실행권한 제거","파일명 난수화","무결성 검사"],"guard":"**확장자 화이트리스트**로 허용된 형식만 업로드를 허용하고, 검증은 반드시 서버측에서 수행함(마지막 `.` 기준·대소문자 처리 포함)\n파일 **크기·개수를 제한**하고 초과 시 차단함\n**저장경로를 web document root 밖으로 분리**하여 웹을 통한 직접 접근을 차단함\n업로드 파일의 **실행권한을 제거**함\n**파일명을 추측 불가한 문자열로 난수화**하여 저장하고, 원본 파일명은 별도 컬럼으로 관리함\n저장·다운로드 시 **무결성 검사**(해시)와 악성코드 검사를 수행하고, 다운로드 파라미터의 경로조작 문자 검증과 접근권한 확인을 거침","diag":"확장자·크기·개수 제한, 저장경로 분리, 실행권한 제거, 파일명 난수화, 무결성 검사","impl":[]},{"k":"SR2-1","sec":2,"name":"인증 대상 및 방식","pg":"통합 수험서 제2장","ans":"어떤 기능과 자원을 인증 대상으로 볼 것인지 식별하고, 그 중요도에 맞는 인증 방식을 설계할 것을 요구하는 기준임.","kw":["인증 후 사용","2단계(강화된) 인증","중요도 분류"],"guard":"중요기능·중요자원을 식별하여 목록화하고, **인증 후에만 사용**하도록 설계함\n계좌이체·개인정보 조회 등 중요기능은 **2단계(강화된) 인증** 또는 재인증을 적용함\n**DB 테이블·자원의 중요도를 분류**하고 분류 등급별 인증 요구수준을 정의함\n인증은 서버측에서 수행하여 클라이언트 보안검사를 우회한 접근이 통하지 않도록 하고, 검증된 인증 프레임워크를 사용함","diag":"중요기능·자원은 인증 후 사용, 중요기능은 2단계(강화된) 인증, DB테이블 중요도 분류","impl":[]},{"k":"SR2-2","sec":2,"name":"인증 수행 제한","pg":"통합 수험서 제2장","ans":"인증 시도를 무제한 반복할 수 없도록 제한하는 방법과 비정상 인증시도에 대한 대응을 설계할 것을 요구하는 기준임.","kw":["인증 반복시도 제한","횟수 초과 시 잠금·지연","불법 인증시도 통지"],"guard":"**인증 반복시도 횟수를 적절한 수로 제한**하고, 그 카운터를 서버측(계정·세션 단위)에서 관리함\n**횟수 초과 시 계정 잠금** 또는 재시도 지연(대기시간 부과)·추가 인증 절차를 적용함\n인증 실패 이력을 기록하고, **불법 인증시도를 관리자·해당 사용자에게 통지**하는 절차를 정의함\n실패 메시지는 아이디 존재 여부가 드러나지 않도록 동일한 문구로 통일함","diag":"인증 반복시도 제한, 횟수 초과 시 잠금·지연, 불법 인증시도 통지","impl":["2-16 반복된 인증시도 제한 기능 부재"]},{"k":"SR2-3","sec":2,"name":"비밀번호 관리","pg":"통합 수험서 제2장","ans":"비밀번호의 생성·저장·변경·재발급 전 과정에 대한 안전한 관리 정책을 설계할 것을 요구하는 기준임.","kw":["생성규칙(길이·조합)","솔트+일방향 해쉬","변경주기","초기화·재발급 절차"],"guard":"**생성규칙 정의** — 최소 길이와 영문·숫자·특수문자 조합 요건을 정하고 서버측에서 검증함\n저장 시 평문·단순 해시를 쓰지 않고 **솔트를 함께 적용한 일방향 해쉬**값을 저장함\n**변경주기**를 정하고 주기 도래 시 변경을 요구하며, 직전 비밀번호 재사용을 제한함\n**초기화·재발급 절차**를 정의함 — 본인확인 후 임시 비밀번호를 발급하고 최초 로그인 시 강제 변경, 유효시간 부여\n비밀번호를 화면·로그·URL 에 평문으로 남기지 않음","diag":"생성규칙(길이·조합), 저장 시 솔트+일방향 해쉬, 변경주기, 초기화·재발급 절차","impl":[]},{"k":"SR2-4","sec":2,"name":"중요자원 접근통제","pg":"통합 수험서 제2장","ans":"중요 정보와 기능에 대해 사용자 권한별 접근을 통제하는 정책과 그 구현 위치를 설계할 것을 요구하는 기준임.","kw":["권한 분류·최소권한","접근통제 정책 서버측 구현","우회 불가"],"guard":"사용자 **권한을 분류**하고 업무 수행에 필요한 **최소권한**만 부여함\n자원별 접근통제 정책(ACL)을 정의하고, 정보·기능을 역할에 따라 배분해 공격노출면을 최소화함\n**접근통제 정책을 서버측에서 구현**하여 화면 노출 제어만으로 권한을 대신하지 않음\n직접 URL 호출·파라미터 변조로 **우회가 불가능**하도록 모든 요청 처리 앞단에서 권한을 검사함\n설정파일·실행파일 등 중요 자원의 파일 권한을 소유자 한정 최소권한으로 설정함","diag":"권한 분류·최소권한, 접근통제 정책 서버측 구현, 우회 불가","impl":[]},{"k":"SR2-5","sec":2,"name":"암호키 관리","pg":"통합 수험서 제2장","ans":"암호화에 사용되는 키의 생명주기 전반을 안전하게 관리하는 절차를 설계할 것을 요구하는 기준임.","kw":["키 생성·분배·접근·파기 절차","하드코딩 금지"],"guard":"**키 생성·분배·접근·파기 절차**를 생명주기 단위로 정의하고 담당자·승인 절차를 명시함\n키는 안전한 난수로 생성하고, 소스코드 내 **하드코딩을 금지**함\n키를 별도의 보호된 저장소(키 관리 시스템·암호화된 설정파일)에 보관하고 접근 권한을 최소화함\n키 교체 주기를 정하고, 폐기 시 복구 불가능하게 파기하며 이력을 남김","diag":"안전한 키 생성·분배·접근·파기 절차, 하드코딩 금지","impl":[]},{"k":"SR2-6","sec":2,"name":"암호연산","pg":"통합 수험서 제2장","ans":"암호화·해시·난수 생성에 사용할 알고리즘과 파라미터를 안전한 것으로 선정하도록 설계할 것을 요구하는 기준임.","kw":["검증된(표준) 암호 알고리즘","안전한 키 길이","안전한 난수(예측 불가)"],"guard":"자체 개발 알고리즘을 배제하고 **검증된(표준) 암호 알고리즘**만 사용하도록 규정함\n**안전한 키 길이**를 명시함 — 비대칭키는 2,048비트 이상, 대칭키는 128비트 이상\n세션ID·암호화키 등 보안결정에 쓰이는 값은 **예측 불가능한 안전한 난수**(암호학적 난수생성기)로 생성하고, 고정 시드를 사용하지 않음\n안전한 운영모드·패딩과 초기화벡터 사용 규칙을 정의함","diag":"검증된(표준) 암호 알고리즘, 안전한 키 길이, 안전한 난수(예측 불가)","impl":[]},{"k":"SR2-7","sec":2,"name":"중요정보 저장","pg":"통합 수험서 제2장","ans":"개인정보·금융정보·인증정보 등 중요정보를 저장할 때의 보호 방법을 설계할 것을 요구하는 기준임.","kw":["중요정보 암호화 저장","메모리·임시파일 노출 최소화","쿠키에 중요정보 저장 금지"],"guard":"저장 대상 **중요정보를 식별**하고, 저장 시 **암호화**(비밀번호는 솔트 포함 일방향 해쉬)를 적용함\n**쿠키·클라이언트 저장소에 중요정보를 저장하지 않음**. 부득이한 경우 보안속성을 설정함\n**메모리·임시파일·로그·주석 내 노출을 최소화**하고 사용 후 즉시 삭제·초기화함\n중요정보 읽기·쓰기 시 권한 인증을 거치도록 하여 적합한 사용자만 접근하게 함","diag":"중요정보 암호화 저장, 메모리·임시파일 내 노출 최소화, 쿠키에 중요정보 저장 금지","impl":[]},{"k":"SR2-8","sec":2,"name":"중요정보 전송","pg":"통합 수험서 제2장","ans":"중요정보를 네트워크로 주고받을 때 노출되지 않도록 전송 방식을 설계할 것을 요구하는 기준임.","kw":["전송 시 암호화(TLS)","암호화 통신채널","캐시 통제"],"guard":"전송 구간에 **암호화 통신채널**(TLS/HTTPS 등)을 적용하거나 데이터 자체를 **암호화하여 전송**함\n중요정보를 URL 쿼리스트링(GET)으로 전달하지 않고 POST 본문으로 전송함\n쿠키에 secure·HttpOnly 속성을 설정하고, 중요정보 화면에는 **캐시 통제** 헤더를 지정하여 저장·재현되지 않게 함\n외부 연계 구간의 암호화 요구사항을 인터페이스 정의서에 명시함","diag":"전송 시 암호화(TLS 등) 또는 암호화 통신채널, 캐시 통제","impl":[]},{"k":"SR3-1","sec":3,"name":"예외처리","pg":"통합 수험서 제2장","ans":"오류·예외 상황에서 내부정보가 노출되지 않고 프로그램이 안전한 상태를 유지하도록 처리 방식을 설계할 것을 요구하는 기준임.","kw":["내부정보(스택트레이스·SQL·경로) 미포함","오류상황 대응(차단·기본값)","예외 누락 없이 처리"],"guard":"오류 메시지에 **내부정보(스택트레이스·SQL문·파일 경로·시스템 정보)를 포함하지 않고**, 사전 정의된 오류코드·메시지만 사용자에게 제공함\n상세 오류 내역은 서버 로그에만 기록하고 로그 접근 권한을 통제함\n**오류상황 대응 방침을 정의함** — 처리 차단, 안전한 기본값 적용, 트랜잭션 롤백 등 실패 시 안전한 방향으로 동작하게 함\n**예외를 누락 없이 처리**함 — 빈 catch 블록을 금지하고, 광범위한 예외 대신 발생 가능한 예외를 구체적으로 처리하며, 함수 반환값을 검사함","diag":"오류 메시지에 내부정보(스택트레이스·SQL·경로) 미포함, 오류상황 대응(차단·기본값), 예외 누락 없이 처리","impl":[]},{"k":"SR4-1","sec":4,"name":"세션통제","pg":"통합 수험서 제2장","ans":"사용자 세션의 생성·유지·종료 전 과정을 통제하여 세션이 탈취·재사용·예측되지 않도록 설계할 것을 요구하는 기준임.","kw":["세션 타임아웃","세션ID 재발급","세션ID 예측 불가","중복 로그인 통제"],"guard":"**세션 타임아웃**(유효시간)을 설정하고 만료 시 세션을 파기하며, 로그아웃 시 세션을 무효화함\n로그인 성공·권한 변경 시점에 **세션ID 를 재발급**하여 기존 세션 식별자를 재사용하지 않음(세션 고정 방지)\n**세션ID 는 예측 불가하도록** 충분한 길이의 안전한 난수로 생성하고, 사용자 정보·시각 등 추측 가능한 값을 조합해 만들지 않음\n**중복 로그인을 통제**함 — 동일 계정의 동시 접속을 차단하거나 기존 세션을 종료함\n인증정보·권한은 서버 세션에 보관하고 쿠키에 저장하지 않으며, 세션 쿠키에 secure·HttpOnly 속성을 설정함","diag":"세션 타임아웃, 재로그인 시 세션ID 재발급, 세션ID 예측 불가, 중복 로그인 통제","impl":[]}],"secn":{"1":"입력데이터 검증 및 표현","2":"보안기능","3":"에러처리","4":"세션통제"}};
let M=DB.m, SECN=DB.secn, STAGE="impl";
let view=[], pos=0, log={}, shown=false, typed={}, shuffled=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.replace(/[\s·,()\[\]"'’“”.]/g,'').toLowerCase();
/* 출처가 .md 라 ** 강조 표기가 섞여 있다. 단어는 그대로 두고 강조만 살린다 */
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

/* 키워드를 부분 토큰으로 쪼개 자가채점에 사용 */
function kwHit(kw, txt){
  const t=norm(txt); if(!t) return false;
  const parts=kw.split(/[·,/]|\s+또는\s+/).map(s=>s.trim()).filter(Boolean);
  return parts.some(p=>{
    const n=norm(p.replace(/\(.*?\)/g,''));
    return n.length>=2 && t.includes(n);
  });
}

function buildFilters(){
  const secs=[...new Set(M.map(m=>+m.sec))].sort((a,b)=>a-b);
  const lab=STAGE==='design'?'분야':'유형';
  $('#fSec').innerHTML=`<option value="">${lab} 전체 (${M.length})</option>`+
    secs.map(n=>{const c=M.filter(m=>m.sec==n).length;
      return `<option value="${n}">${lab} ${n} · ${SECN[n]} (${c})</option>`;}).join('');
}
function setStage(s){
  if(STAGE===s) return;
  STAGE=s;
  M = s==='design' ? DBD.d : DB.m;
  SECN = s==='design' ? DBD.secn : DB.secn;
  $('#bImpl').classList.toggle('on', s==='impl');
  $('#bDsgn').classList.toggle('on', s==='design');
  document.querySelector('header h1').textContent =
    s==='design' ? '보안대책 암기 · 설계단계 20항목' : '보안대책 암기 · 구현단계 49항목';
  $('#fSec').value=''; shown=false; buildFilters(); apply();
}
/* 검색은 두 단계를 «한 번에» 훑는다 */
function runSearch(){
  const t=$('#q').value.trim().toLowerCase();
  const box=$('#srch');
  if(!t){ box.innerHTML=''; return; }
  const hits=[];
  [['impl',DB.m,DB.secn],['design',DBD.d,DBD.secn]].forEach(([st,arr,sn])=>{
    arr.forEach((m,i)=>{
      const hay=[m.k,m.name,m.ans,m.guard,m.diag||'',(m.kw||[]).join(' ')].join(' ').toLowerCase();
      if(hay.indexOf(t)>=0) hits.push({st,i,m,sn});
    });
  });
  if(!hits.length){ box.innerHTML='<div class="sr"><button disabled>일치하는 항목이 없습니다</button></div>'; return; }
  box.innerHTML='<div class="sr">'+hits.slice(0,40).map((h,n)=>
    `<button data-st="${h.st}" data-k="${esc(h.m.k)}"><span class="sk">${esc(h.m.k)}</span>${esc(h.m.name)}`+
    `<span class="ss">${h.st==='design'?'설계':'구현'} · ${esc(h.sn[h.m.sec])}</span></button>`).join('')+
    (hits.length>40?`<button disabled>… 외 ${hits.length-40}건</button>`:'')+'</div>';
  box.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{
    setStage(b.dataset.st);
    $('#fSec').value=''; apply();
    const p=view.findIndex(m=>m.k===b.dataset.k);
    if(p>=0){ pos=p; shown=false; render(); }
    $('#q').value=''; $('#srch').innerHTML='';
    window.scrollTo({top:0,behavior:'smooth'});
  });
}
function apply(keepPos){
  const s=$('#fSec').value, L=$('#fLen').value;
  view=M.filter(m=>{
    if(s&&m.sec!=s) return false;
    if(L==='s'&&m.guard.length>100) return false;
    if(L==='l'&&m.guard.length<=100) return false;
    return true;
  });
  shuffled=false;
  if(!keepPos) pos=0;
  if(pos>=view.length) pos=Math.max(0,view.length-1);
  $('#sFilter').textContent=`${view.length}항목`;
  render();
}
function render(){
  const host=$('#host');
  if(!view.length){host.innerHTML='<div class="card"><div class="empty">조건에 맞는 항목이 없습니다.</div></div>';stats();return;}
  const m=view[pos], g=log[m.k];
  const mk=g?`<span class="mark m${g}">${['','암기','애매','모름'][g]}</span>`:'';
  let body=`<div class="card">
    <div class="qhead"><span class="pill g">${STAGE==='design'?'분야':'유형'} ${m.sec} · ${esc(SECN[m.sec])}</span><span class="pill">${m.k}</span>${mk}
      <span class="cnt">${pos+1} / ${view.length}</span></div>
    <div class="qname">${esc(m.name)}</div>
    <div class="pg">${STAGE==='design'?'출처':'개발보안 가이드'} ${esc(m.pg)} · ${STAGE==='design'?'대응방법':'보안대책 원문'} ${m.guard.length}자</div>
    <div class="sect" style="border-top:none;padding-top:12px;margin-top:12px">
      <div class="lab">${STAGE==='design'?'이 보안설계 기준의 「대응방법」을 답안처럼 써보세요':'이 약점의 보안대책(조치방안)을 답안처럼 써보세요'}</div>
      <textarea id="ta" placeholder="예) …하도록 …한다.">${esc(typed[m.k]||'')}</textarea>
    </div>`;
  if(!shown){
    body+=`<div class="acts"><button class="big" id="bShow">답안 보기</button>
      <button class="big sub" id="bSkip">건너뛰기 →</button></div>`;
  }else{
    const kws=m.kw.map(k=>{
      const hit=kwHit(k, typed[m.k]||'');
      return `<span class="kwi ${hit?'hit':'miss'}">${esc(k)}</span>`;
    }).join('');
    body+=`<div class="sect">
        <div class="lab">${STAGE==='design'?'기준 「설명」':'시험 답안 문장'} <span class="tagx">— ${STAGE==='design'?'이 기준이 무엇을 요구하는가':'원문을 1~2문장으로 압축한 요약'}</span></div>
        <div class="ansbox">${esc(m.ans)}</div></div>
      <div class="sect"><div class="lab">채점 키워드 <span class="tagx">— 위 입력칸과 자동 대조</span></div>
        <div class="kw">${kws}</div>
        <div class="note">○ 는 입력한 문장에 그 표현이 들어 있다는 뜻입니다. × 가 남았다면 그 단어를 빠뜨린 것입니다.</div></div>
      <div class="sect"><div class="lab">${STAGE==='design'?'대응방법':'보안대책 원문'} <span class="tagx">— ${STAGE==='design'?'실습 문제은행 8 파트A 모범답안':'개발보안 가이드 '+esc(m.pg)}</span></div>
        <div class="raw">${STAGE==='design'?md(m.guard):esc(m.guard)}</div>
        ${m.diag?`<details><summary>${STAGE==='design'?'통합 수험서 제2장 핵심 키워드 원문 보기':'진단방법 원문도 보기'}</summary><div class="raw" style="margin-top:8px">${esc(m.diag)}</div></details>`:''}</div>
      ${(m.impl&&m.impl.length)?`<div class="sect"><div class="lab">대응되는 구현단계 보안약점 <span class="tagx">— 통합 수험서에 명시된 것만</span></div>
        <div class="impl">${m.impl.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:''}
      <div class="grade">
        <button class="g1" data-g="1">1 · 썼다</button>
        <button class="g2" data-g="2">2 · 애매</button>
        <button class="g3" data-g="3">3 · 못 썼다</button>
      </div>`;
  }
  body+=`<div class="nav"><button id="bPrev">← 이전</button><button id="bNext">다음 →</button></div></div>`;
  host.innerHTML=body;
  const ta=$('#ta');
  ta.oninput=()=>{typed[m.k]=ta.value;};
  if($('#bShow')) $('#bShow').onclick=reveal;
  if($('#bSkip')) $('#bSkip').onclick=()=>go(1);
  document.querySelectorAll('.grade button').forEach(b=>b.onclick=()=>{log[m.k]=+b.dataset.g;render();setTimeout(()=>go(1),160);});
  $('#bPrev').onclick=()=>go(-1);
  $('#bNext').onclick=()=>go(1);
  stats();
}
function reveal(){shown=true;render();}
function go(d){
  if(!view.length)return;
  pos=(pos+d+view.length)%view.length; shown=false; render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function goTo(n){
  if(!view.length)return;
  n=Math.max(1,Math.min(view.length,parseInt(n,10)||1));
  pos=n-1; shown=false; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function stats(){
  const v=Object.values(log);
  $('#sOk').textContent=v.filter(x=>x===1).length;
  $('#sMid').textContent=v.filter(x=>x===2).length;
  $('#sNo').textContent=v.filter(x=>x===3).length;
  $('#sPos').textContent=view.length?`${pos+1}/${view.length}`:'-';
  const jn=$('#jN'); if(jn){jn.max=view.length; if(document.activeElement!==jn) jn.value=view.length?pos+1:'';}
  syncHash();
}
function syncHash(){
  if(shuffled){history.replaceState(null,'',location.pathname+location.search);return;}
  const f=[$('#fSec').value,$('#fLen').value,STAGE].join('~');
  history.replaceState(null,'','#'+(pos+1)+(f==='~'?'':'|'+encodeURIComponent(f)));
}
function readHash(){
  const h=location.hash.slice(1); if(!h)return null;
  const p=h.split('|');
  return {n:parseInt(p[0],10)||1, f:p[1]?decodeURIComponent(p[1]).split('~'):null};
}
$('#bImpl').onclick=()=>setStage('impl');
$('#bDsgn').onclick=()=>setStage('design');
$('#q').oninput=runSearch;
$('#q').onkeydown=e=>{if(e.key==='Escape'){$('#q').value='';$('#srch').innerHTML='';$('#q').blur();}};
$('#fSec').onchange=$('#fLen').onchange=()=>apply();
$('#bShuf').onclick=()=>{for(let i=view.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[view[i],view[j]]=[view[j],view[i]];}shuffled=true;pos=0;shown=false;render();};
$('#bWeak').onclick=()=>{
  const w=M.filter(m=>log[m.k]===2||log[m.k]===3);
  if(!w.length){alert('애매/모름으로 표시한 항목이 없습니다.');return;}
  view=w; pos=0; shown=false; shuffled=true;
  w.forEach(m=>delete log[m.k]);
  $('#sFilter').textContent=`${view.length}항목 (약한 것만)`;
  render();
};
$('#bReset').onclick=()=>{if(confirm('채점 기록과 작성한 답안을 모두 지웁니다.')){log={};typed={};shown=false;apply();}};
$('#bGo').onclick=()=>goTo($('#jN').value);
$('#jN').onkeydown=e=>{if(e.key==='Enter'){goTo($('#jN').value);$('#jN').blur();}};
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='INPUT'||t==='SELECT')return;
  if(e.key===' '){e.preventDefault(); shown?go(1):reveal(); return;}
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(shown&&['1','2','3'].includes(e.key)){
    log[view[pos].k]=+e.key; render(); setTimeout(()=>go(1),160);
  }
});
buildFilters();
const H=readHash();
if(H&&H.f&&H.f[2]==='design') setStage('design');
if(H&&H.f){$('#fSec').value=H.f[0]||'';$('#fLen').value=H.f[1]||'';}
apply();
if(H) goTo(H.n);
</script></body></html>
